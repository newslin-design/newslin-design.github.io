<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POC v4 — 3D 毛線麵（TubeGeometry）</title>
    <style>
        :root { --bg:#f6efe6; --ink:#4a3b32; --line:#d8c7b4; --accent:#c96a4b; }
        * { box-sizing:border-box; }
        body{ margin:0; font-family:"Segoe UI","Noto Sans TC",system-ui,sans-serif;
            background:radial-gradient(120% 120% at 50% 0%, #fff8ef 0%, var(--bg) 70%);
            color:var(--ink); min-height:100vh; padding:20px 16px 50px;
            display:flex; flex-direction:column; align-items:center; }
        h1{ font-size:20px; margin:0 0 2px; }
        .sub{ font-size:13px; color:#8a7563; margin:0 0 14px; text-align:center; max-width:660px; line-height:1.6; }
        #wrap{ position:relative; border-radius:18px; overflow:hidden;
            box-shadow:0 18px 44px -18px rgba(90,60,40,.55); background:#efe3d3; }
        #wrap canvas{ display:block; }
        #hint{ position:absolute; left:12px; bottom:10px; font-size:12px; color:#8a7563;
            background:rgba(255,250,242,.85); border-radius:8px; padding:4px 10px; pointer-events:none; }
        .panel{ width:min(660px,100%); display:grid; gap:12px; margin-top:14px; }
        .row{ background:#fffaf2; border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
        .row h3{ margin:0 0 8px; font-size:13px; color:#8a7563; font-weight:700; }
        .chips{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
        button{ font:inherit; font-size:13px; border:1px solid var(--line); background:#fff; color:var(--ink);
            border-radius:999px; padding:7px 14px; cursor:pointer; transition:all .15s; user-select:none; touch-action:none; }
        button:hover{ border-color:var(--accent); }
        button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
        button.big{ font-weight:700; }
        .sw{ display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15); }
        .note{ font-size:12px; color:#a08b78; margin-top:6px; line-height:1.6; }
    </style>
</head>

<body>
    <h1>🍝 POC v4 — 3D 毛線麵</h1>
    <p class="sub">一條 tube＝一條毛線＝一根麵，沿五瓣花形路徑盤出一盤。勾針帶頭織、按住「織麵」生長、完成後配料掉落。判斷重點：<b>可不可愛</b>。</p>

    <div id="wrap">
        <div id="hint">拖曳旋轉視角</div>
    </div>

    <div class="panel">
        <div class="row">
            <h3>玩</h3>
            <div class="chips">
                <button id="growBtn" class="big">🧶 按住織麵</button>
                <button id="finishBtn">一鍵織完</button>
                <button id="resetBtn">↺ 重織</button>
                <button id="spinBtn" class="on">🔄 自動旋轉</button>
                <button id="shotBtn">📷 下載美照</button>
            </div>
        </div>
        <div class="row">
            <h3>醬料 = 毛線色（清炒有光澤、白醬最霧面）</h3>
            <div class="chips" id="sauceChips"></div>
            <p class="note">毛線質感＝程序化撚線條紋貼圖＋bump；醬料同時改顏色與粗糙度。活動正式版會把 three.js 改為本地檔（現用 CDN）。</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
    const W = Math.min(660, window.innerWidth - 32), H = Math.round(W * 0.72);

    // ---------- Scene ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#efe3d3');
    const camera = new THREE.PerspectiveCamera(42, W/H, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    document.getElementById('wrap').prepend(renderer.domElement);

    scene.add(new THREE.HemisphereLight('#fff6e8', '#b39274', 1.1));
    const sun = new THREE.DirectionalLight('#ffffff', 1.6);
    sun.position.set(-12, 22, 14);
    scene.add(sun);

    // 桌面
    const table = new THREE.Mesh(
        new THREE.CylinderGeometry(60, 60, 1, 48),
        new THREE.MeshStandardMaterial({ color:'#d9c3a8', roughness:.95 })
    );
    table.position.y = -0.8;
    scene.add(table);

    // 盤子
    const plate = new THREE.Group();
    const plateBase = new THREE.Mesh(
        new THREE.CylinderGeometry(13.5, 11.5, 0.9, 64),
        new THREE.MeshStandardMaterial({ color:'#fffaf2', roughness:.6 })
    );
    plateBase.position.y = 0.15;
    const plateRim = new THREE.Mesh(
        new THREE.TorusGeometry(13.2, 0.55, 12, 64),
        new THREE.MeshStandardMaterial({ color:'#f4e8da', roughness:.55 })
    );
    plateRim.rotation.x = Math.PI/2;
    plateRim.position.y = 0.62;
    plate.add(plateBase, plateRim);
    scene.add(plate);

    // ---------- 毛線貼圖（程序化撚線條紋）----------
    function yarnTexture(){
        const c = document.createElement('canvas'); c.width = c.height = 64;
        const g = c.getContext('2d');
        g.fillStyle = '#ffffff'; g.fillRect(0,0,64,64);
        g.strokeStyle = 'rgba(90,60,40,.28)'; g.lineWidth = 7; g.lineCap='round';
        for(let i=-2;i<6;i++){
            g.beginPath(); g.moveTo(i*16-8, 72); g.lineTo(i*16+40, -8); g.stroke();
        }
        g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 3;
        for(let i=-2;i<6;i++){
            g.beginPath(); g.moveTo(i*16-2, 72); g.lineTo(i*16+46, -8); g.stroke();
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(90, 1.6);
        return tex;
    }
    const twist = yarnTexture();

    // ---------- 麵條路徑：五瓣花形螺旋 ----------
    function buildPath(){
        const pts = [];
        const ROUNDS = 7, STEPS = 1200;
        for(let i=0;i<=STEPS;i++){
            const t = i/STEPS;
            const theta = t * ROUNDS * Math.PI * 2;
            const petalAmp = 2.6 * Math.pow(Math.max(0,(t-0.42)/0.58), 1.4);   // 外圈才長出花瓣
            const petal = Math.pow(0.5 + 0.5*Math.cos(5*theta), 2);
            const r = 1.5 + 8.0*t + petalAmp*petal;
            const y = 1.05 + 0.3*Math.sin(theta*7)*Math.min(1,t*2.5);           // 微交疊起伏
            pts.push(new THREE.Vector3(r*Math.cos(theta), y, r*Math.sin(theta)));
        }
        return new THREE.CatmullRomCurve3(pts);
    }
    const curve = buildPath();
    const TUBE_SEGS = 1500, RADIAL = 10, YARN_R = 0.52;
    const tubeGeo = new THREE.TubeGeometry(curve, TUBE_SEGS, YARN_R, RADIAL, false);
    const totalIndex = tubeGeo.index.count;

    const sauces = {
        '紅醬': { color:'#d96b47', rough:.8 },
        '白醬': { color:'#f0e6d2', rough:.95 },
        '青醬': { color:'#8ba05e', rough:.8 },
        '清炒': { color:'#e8c987', rough:.3 },
        '墨魚': { color:'#55505c', rough:.75 }
    };
    const yarnMat = new THREE.MeshStandardMaterial({
        color: sauces['紅醬'].color, roughness: sauces['紅醬'].rough,
        map: twist, bumpMap: twist, bumpScale: .35
    });
    const noodle = new THREE.Mesh(tubeGeo, yarnMat);
    scene.add(noodle);

    // 麵頭圓端
    const tip = new THREE.Mesh(new THREE.SphereGeometry(YARN_R, 12, 12), yarnMat);
    scene.add(tip);

    // ---------- 勾針（柄 + 彎頭）----------
    const hook = new THREE.Group();
    const hookMat = new THREE.MeshStandardMaterial({ color:'#c8a06a', roughness:.4, metalness:.2 });
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.22,.26,7,10), hookMat);
    shaft.position.y = 3.8;
    const head = new THREE.Mesh(new THREE.TorusGeometry(.55,.2,8,14,Math.PI*1.25), hookMat);
    head.position.y = .35;
    const grip = new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,2.2,10),
        new THREE.MeshStandardMaterial({ color:'#8a5f43', roughness:.7 }));
    grip.position.y = 6.2;
    hook.add(shaft, head, grip);
    hook.rotation.z = -0.5;
    scene.add(hook);

    // ---------- 配料（完成後掉落）----------
    const topGroup = new THREE.Group();
    scene.add(topGroup);
    const topDefs = [
        { geo:new THREE.SphereGeometry(1.05,14,12), color:'#cf4630', squash:.75, n:3 },  // 番茄
        { geo:new THREE.BoxGeometry(1.3,.5,1.3),   color:'#f2cf72', squash:1,  n:3 },   // 起司
        { geo:new THREE.IcosahedronGeometry(.75,0), color:'#4f7c39', squash:.85,n:4 }    // 羅勒
    ];
    const toppings = [];
    let seed = 7;
    const rnd = ()=> (seed = (seed*16807)%2147483647) / 2147483647;
    topDefs.forEach(def=>{
        for(let i=0;i<def.n;i++){
            const m = new THREE.Mesh(def.geo, new THREE.MeshStandardMaterial({ color:def.color, roughness:.6 }));
            const a = rnd()*Math.PI*2, r = 2.5 + rnd()*6;
            m.position.set(r*Math.cos(a), 8, r*Math.sin(a));
            m.rotation.set(rnd()*3, rnd()*3, 0);
            m.scale.setScalar(0.001);
            m.userData = { targetY: 1.9 + rnd()*0.5, squash: def.squash, delay: rnd()*0.6, t: -1 };
            topGroup.add(m); toppings.push(m);
        }
    });

    // ---------- 狀態與互動 ----------
    let progress = 0.02, growing = false, spinning = true, served = false;
    let azim = 0.6, elev = 0.95, dragging = false, px0 = 0, py0 = 0;

    function updateCamera(){
        const R = 34;
        camera.position.set(
            R*Math.cos(elev)*Math.cos(azim),
            R*Math.sin(elev),
            R*Math.cos(elev)*Math.sin(azim)
        );
        camera.lookAt(0, 1.5, 0);
    }
    updateCamera();

    function setProgress(p){
        progress = Math.min(1, Math.max(0.02, p));
        const idx = Math.floor(totalIndex * progress / 6) * 6;
        tubeGeo.setDrawRange(0, idx);
        const pt = curve.getPointAt(progress);
        tip.position.copy(pt);
        hook.position.copy(pt);
        hook.position.y += .1;
        if(progress >= 1 && !served){ served = true; toppings.forEach(m=> m.userData.t = -m.userData.delay); }
        if(progress < 1 && served){ served = false; toppings.forEach(m=>{ m.userData.t = -1; m.scale.setScalar(0.001); m.position.y = 8; }); }
    }
    setProgress(progress);

    const cvs = renderer.domElement;
    cvs.addEventListener('pointerdown', e=>{ dragging = true; px0 = e.clientX; py0 = e.clientY; });
    window.addEventListener('pointermove', e=>{
        if(!dragging) return;
        azim += (e.clientX - px0) * 0.008;
        elev = Math.min(1.35, Math.max(0.25, elev + (e.clientY - py0) * 0.005));
        px0 = e.clientX; py0 = e.clientY;
        updateCamera();
    });
    window.addEventListener('pointerup', ()=> dragging = false);

    const growBtn = document.getElementById('growBtn');
    growBtn.addEventListener('pointerdown', ()=> growing = true);
    window.addEventListener('pointerup', ()=> growing = false);
    growBtn.addEventListener('pointerleave', ()=> growing = false);
    document.getElementById('finishBtn').onclick = ()=> setProgress(1);
    document.getElementById('resetBtn').onclick = ()=> setProgress(0.02);
    const spinBtn = document.getElementById('spinBtn');
    spinBtn.onclick = ()=>{ spinning = !spinning; spinBtn.classList.toggle('on', spinning); };
    document.getElementById('shotBtn').onclick = ()=>{
        const a = document.createElement('a');
        a.href = renderer.domElement.toDataURL('image/png');
        a.download = 'pastacrochet.png';
        a.click();
    };

    const chips = document.getElementById('sauceChips');
    Object.entries(sauces).forEach(([name, s], i)=>{
        const b = document.createElement('button');
        b.innerHTML = `<span class="sw" style="background:${s.color}"></span>${name}`;
        if(i===0) b.classList.add('on');
        b.onclick = ()=>{
            [...chips.children].forEach(c=>c.classList.remove('on'));
            b.classList.add('on');
            yarnMat.color.set(s.color);
            yarnMat.roughness = s.rough;
        };
        chips.appendChild(b);
    });

    // ---------- Loop ----------
    function updateToppings(dt){
        toppings.forEach(m=>{
            const u = m.userData;
            if(u.t < 0 && served){ u.t += dt; return; }
            if(!served) return;
            u.t = Math.min(1, u.t + dt*2.2);
            if(u.t <= 0) return;
            const e = 1 - Math.pow(1-u.t, 3);
            m.position.y = 8 + (u.targetY - 8)*e;
            m.scale.set(e, e*u.squash + (1-u.squash)*e*e, e);
        });
    }

    let last = performance.now();
    function loop(now){
        const dt = Math.min(0.05, (now-last)/1000); last = now;
        if(growing) setProgress(progress + dt*0.16);
        if(spinning && !dragging){ azim += dt*0.25; updateCamera(); }
        updateToppings(dt);
        renderer.render(scene, camera);
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // 驗證掛鉤（headless 環境 rAF 不觸發，需可同步渲染）
    window.__poc = {
        setProgress, getProgress: ()=>progress,
        setSauce: n=>{ yarnMat.color.set(sauces[n].color); yarnMat.roughness = sauces[n].rough; },
        served: ()=>served, renderer, scene, camera,
        renderOnce: ()=> renderer.render(scene, camera),
        stepAnim: s=>{ for(let i=0;i<s*60;i++) updateToppings(1/60); }
    };
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POC v5 — 全螢幕 3D + 浮動 UI + 織圖即時變色</title>
    <style>
        :root { --ink:#4a3b32; --accent:#c96a4b; --glass:rgba(255,250,242,.78); --gborder:rgba(180,150,120,.4); }
        * { box-sizing:border-box; }
        html,body{ margin:0; height:100%; overflow:hidden; font-family:"Segoe UI","Noto Sans TC",system-ui,sans-serif; color:var(--ink); }
        #gl{ position:fixed; inset:0; }
        #gl canvas{ display:block; width:100vw; height:100vh; }

        .glass{ background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
            border:1px solid var(--gborder); border-radius:16px; box-shadow:0 10px 30px -14px rgba(90,60,40,.4); }

        #brand{ position:fixed; top:16px; left:16px; padding:9px 16px; font-size:14px; font-weight:700; letter-spacing:.02em; }
        #brand small{ font-weight:400; color:#8a7563; margin-left:8px; }

        #actions{ position:fixed; top:16px; right:16px; display:flex; gap:8px; padding:8px; }
        #actions button{ border:none; background:transparent; font:inherit; font-size:13px; color:var(--ink);
            padding:7px 12px; border-radius:10px; cursor:pointer; }
        #actions button:hover{ background:rgba(201,106,75,.12); }
        #actions button.on{ background:var(--accent); color:#fff; }

        #saucedock{ position:fixed; left:50%; transform:translateX(-50%); bottom:118px;
            display:flex; gap:8px; padding:10px 12px; }
        #saucedock button{ border:1px solid transparent; background:transparent; font:inherit; font-size:13px;
            color:var(--ink); padding:7px 13px; border-radius:999px; cursor:pointer; transition:all .15s; }
        #saucedock button:hover{ border-color:var(--gborder); }
        #saucedock button.on{ background:var(--accent); color:#fff; box-shadow:0 4px 14px -4px var(--accent); }
        .sw{ display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:-1px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); }

        #holdwrap{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); width:84px; height:84px;
            border-radius:50%; padding:5px; background:conic-gradient(var(--accent) 0%, rgba(180,150,120,.25) 0%); }
        #holdBtn{ width:100%; height:100%; border-radius:50%; border:none; cursor:pointer; user-select:none; touch-action:none;
            background:var(--glass); backdrop-filter:blur(10px); font:inherit; font-size:12.5px; font-weight:700; color:var(--ink);
            box-shadow:0 12px 26px -12px rgba(90,60,40,.55); }
        #holdBtn:active{ transform:scale(.96); }

        #chartPanel{ position:fixed; right:16px; top:72px; width:min(320px, 42vw); padding:14px; display:flex; flex-direction:column; gap:8px; }
        #chartPanel h4{ margin:0; font-size:13px; }
        #chartPanel .cap{ font-size:11.5px; color:#8a7563; line-height:1.5; }
        #chartBox{ background:#fff; border-radius:10px; overflow:hidden; }
        #chartBox svg{ display:block; width:100%; height:auto; }
        #chartPanel.hide{ display:none; }

        #hint{ position:fixed; left:16px; bottom:20px; font-size:12px; color:#8a7563; padding:6px 12px; }
        @media (max-width:820px){ #chartPanel{ display:none; } }
    </style>
</head>

<body>
    <div id="gl"></div>

    <div id="brand" class="glass">🧶 pastacrochet <small>毛線義大利麵餐廳</small></div>

    <div id="actions" class="glass">
        <button id="chartBtn" class="on">📜 織圖</button>
        <button id="spinBtn" class="on">🔄</button>
        <button id="resetBtn">↺</button>
        <button id="shotBtn">📷 帶走美照</button>
    </div>

    <div id="chartPanel" class="glass">
        <h4>你的織譜（跟著配方變色）</h4>
        <div id="chartBox"></div>
        <div class="cap">結帳時帶走：這張織譜 + 上面那盤的美照。織譜顏色＝你選的醬料，回家真的能鉤。</div>
    </div>

    <div id="saucedock" class="glass"></div>

    <div id="holdwrap"><button id="holdBtn">按住<br>織麵</button></div>

    <div id="hint" class="glass">拖曳旋轉視角</div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
    // ================= Renderer / Scene =================
    const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('gl').appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#f2e5d3');
    scene.fog = new THREE.Fog('#f2e5d3', 55, 120);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 300);

    scene.add(new THREE.HemisphereLight('#fff6e6', '#a8875f', .85));
    const sun = new THREE.DirectionalLight('#fff4e0', 2.2);
    sun.position.set(-14, 26, 12);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = sun.shadow.camera.bottom = -24;
    sun.shadow.camera.right = sun.shadow.camera.top = 24;
    sun.shadow.bias = -0.0004;
    sun.shadow.radius = 6;
    scene.add(sun);
    const fill = new THREE.DirectionalLight('#e8f0ff', .5);
    fill.position.set(16, 10, -14);
    scene.add(fill);

    // ================= 桌面（木紋漸層） =================
    function woodTexture(){
        const c = document.createElement('canvas'); c.width = c.height = 512;
        const g = c.getContext('2d');
        const grad = g.createRadialGradient(256,256,60, 256,256,360);
        grad.addColorStop(0,'#dcc4a4'); grad.addColorStop(1,'#c3a37e');
        g.fillStyle = grad; g.fillRect(0,0,512,512);
        g.globalAlpha = .16;
        for(let i=0;i<40;i++){
            g.strokeStyle = i%2 ? '#b08d64' : '#e7d2b4';
            g.lineWidth = 2 + Math.random()*5;
            g.beginPath();
            const y = Math.random()*512;
            g.moveTo(0,y); g.bezierCurveTo(170,y+18*(Math.random()-.5), 340,y-18*(Math.random()-.5), 512,y);
            g.stroke();
        }
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
    }
    const table = new THREE.Mesh(
        new THREE.CircleGeometry(80, 48),
        new THREE.MeshStandardMaterial({ map: woodTexture(), roughness:.9 })
    );
    table.rotation.x = -Math.PI/2;
    table.position.y = -0.35;
    table.receiveShadow = true;
    scene.add(table);

    // ================= 陶瓷盤（Lathe 剖面 + clearcoat） =================
    const platePts = [];
    [[0,0],[8.6,0],[10.8,.35],[12.6,1.15],[13.5,1.85],[13.9,1.95]].forEach(p=> platePts.push(new THREE.Vector2(p[0], p[1])));
    const plate = new THREE.Mesh(
        new THREE.LatheGeometry(platePts, 72),
        new THREE.MeshPhysicalMaterial({ color:'#fffaf1', roughness:.32, clearcoat:.5, clearcoatRoughness:.35 })
    );
    plate.receiveShadow = true;
    scene.add(plate);

    // ================= 毛線材質（V 字針目 + 布料 sheen） =================
    function stitchTexture(){
        const c = document.createElement('canvas'); c.width = 256; c.height = 128;
        const g = c.getContext('2d');
        g.fillStyle = '#ffffff'; g.fillRect(0,0,256,128);
        g.lineCap = 'round';
        for(let x = -16; x < 272; x += 44){
            // 一個「V」= 一針：兩道粗斜線交會
            g.strokeStyle = 'rgba(105,70,45,.30)'; g.lineWidth = 15;
            g.beginPath(); g.moveTo(x, 14);      g.lineTo(x+22, 112); g.stroke();
            g.beginPath(); g.moveTo(x+44, 14);   g.lineTo(x+22, 112); g.stroke();
            g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 5;
            g.beginPath(); g.moveTo(x+4, 16);    g.lineTo(x+24, 104); g.stroke();
            g.beginPath(); g.moveTo(x+40, 16);   g.lineTo(x+22, 104); g.stroke();
        }
        const t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(110, 1);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
    }
    const stitchTex = stitchTexture();

    const sauces = {
        '紅醬': { color:'#cf6242', rough:.72, coat:0   },
        '白醬': { color:'#efe4cf', rough:.9,  coat:0   },
        '青醬': { color:'#87a057', rough:.72, coat:0   },
        '清炒': { color:'#e6c47f', rough:.38, coat:.45 },
        '墨魚': { color:'#565064', rough:.7,  coat:0   }
    };
    const yarnMat = new THREE.MeshPhysicalMaterial({
        color: sauces['紅醬'].color, roughness: sauces['紅醬'].rough,
        map: stitchTex, bumpMap: stitchTex, bumpScale: .5,
        sheen: 1, sheenRoughness: .55, sheenColor: new THREE.Color('#fff2df'),
        clearcoat: 0, clearcoatRoughness: .5
    });

    // ================= 麵條路徑（五瓣花螺旋） =================
    function buildPath(){
        const pts = [];
        const ROUNDS = 6.5, STEPS = 1200;
        for(let i=0;i<=STEPS;i++){
            const t = i/STEPS;
            const theta = t * ROUNDS * Math.PI * 2;
            const petalAmp = 2.9 * Math.pow(Math.max(0,(t-0.4)/0.6), 1.35);
            const petal = Math.pow(0.5 + 0.5*Math.cos(5*theta), 2);
            const r = 1.6 + 7.6*t + petalAmp*petal;
            const y = 2.15 + 0.26*Math.sin(theta*7)*Math.min(1,t*2.5);
            pts.push(new THREE.Vector3(r*Math.cos(theta), y, r*Math.sin(theta)));
        }
        return new THREE.CatmullRomCurve3(pts);
    }
    const curve = buildPath();
    const tubeGeo = new THREE.TubeGeometry(curve, 1600, 0.58, 12, false);
    const totalIndex = tubeGeo.index.count;
    const noodle = new THREE.Mesh(tubeGeo, yarnMat);
    noodle.castShadow = true;
    scene.add(noodle);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.58, 14, 14), yarnMat);
    tip.castShadow = true;
    scene.add(tip);

    // ================= 勾針 =================
    const hook = new THREE.Group();
    const metal = new THREE.MeshPhysicalMaterial({ color:'#d9b07c', roughness:.28, metalness:.65, clearcoat:.4 });
    const wood  = new THREE.MeshStandardMaterial({ color:'#8a5f43', roughness:.6 });
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.2,.24,6.4,12), metal);
    shaft.position.y = 3.6;
    const head = new THREE.Mesh(new THREE.TorusGeometry(.5,.18,10,16,Math.PI*1.3), metal);
    head.position.y = .35;
    const grip = new THREE.Mesh(new THREE.CapsuleGeometry(.42,1.8,6,12), wood);
    grip.position.y = 6.1;
    hook.add(shaft, head, grip);
    hook.rotation.z = -0.48;
    hook.traverse(m=>{ m.castShadow = true; });
    scene.add(hook);

    // ================= 配料 =================
    const topGroup = new THREE.Group();
    scene.add(topGroup);
    let seed = 7;
    const rnd = ()=> (seed = (seed*16807)%2147483647) / 2147483647;
    const toppings = [];
    function addTopping(mesh, squash){
        const a = rnd()*Math.PI*2, r = 2.5 + rnd()*6;
        mesh.position.set(r*Math.cos(a), 9, r*Math.sin(a));
        mesh.rotation.set(rnd()*3, rnd()*3, 0);
        mesh.scale.setScalar(0.001);
        mesh.castShadow = true;
        mesh.userData = { targetY: 2.9 + rnd()*0.5, squash, delay: rnd()*0.6, t:-1 };
        topGroup.add(mesh); toppings.push(mesh);
    }
    const tomatoMat = new THREE.MeshPhysicalMaterial({ color:'#c8402c', roughness:.3, clearcoat:.7, clearcoatRoughness:.25 });
    const cheeseMat = new THREE.MeshPhysicalMaterial({ color:'#f3d47e', roughness:.55, sheen:.6, sheenColor:new THREE.Color('#fff') });
    const basilMat  = new THREE.MeshPhysicalMaterial({ color:'#557f38', roughness:.45, sheen:.8, sheenColor:new THREE.Color('#dfffc0') });
    for(let i=0;i<3;i++) addTopping(new THREE.Mesh(new THREE.SphereGeometry(1.0,16,14), tomatoMat), .72);
    for(let i=0;i<3;i++) addTopping(new THREE.Mesh(new THREE.BoxGeometry(1.25,.42,1.25), cheeseMat), 1);
    for(let i=0;i<4;i++){
        const leaf = new THREE.Mesh(new THREE.SphereGeometry(.8,10,8), basilMat);
        leaf.scale.set(1,.3,1);   // 之後由掉落動畫接手 scale，先記在 userData
        addTopping(leaf, .3);
    }

    // ================= 狀態 / 互動 =================
    let progress = 0.02, growing = false, spinning = true, served = false;
    let azim = 0.7, elev = 0.9, dragging = false, px0=0, py0=0;

    function updateCamera(){
        const R = 33;
        camera.position.set(R*Math.cos(elev)*Math.cos(azim), R*Math.sin(elev), R*Math.cos(elev)*Math.sin(azim));
        camera.lookAt(0, 1.6, 0);
    }
    updateCamera();

    const holdwrap = document.getElementById('holdwrap');
    function setProgress(p){
        progress = Math.min(1, Math.max(0.02, p));
        tubeGeo.setDrawRange(0, Math.floor(totalIndex*progress/6)*6);
        const pt = curve.getPointAt(progress);
        tip.position.copy(pt);
        hook.position.copy(pt); hook.position.y += .1;
        holdwrap.style.background = `conic-gradient(var(--accent) ${progress*100}%, rgba(180,150,120,.25) ${progress*100}%)`;
        if(progress>=1 && !served){ served = true; toppings.forEach(m=> m.userData.t = -m.userData.delay); }
        if(progress<1 && served){ served = false; toppings.forEach(m=>{ m.userData.t=-1; m.scale.setScalar(.001); m.position.y = 9; }); }
    }
    setProgress(progress);

    const cvs = renderer.domElement;
    cvs.addEventListener('pointerdown', e=>{ dragging=true; px0=e.clientX; py0=e.clientY; });
    window.addEventListener('pointermove', e=>{
        if(!dragging) return;
        azim += (e.clientX-px0)*0.008;
        elev = Math.min(1.35, Math.max(0.22, elev+(e.clientY-py0)*0.005));
        px0=e.clientX; py0=e.clientY;
        updateCamera();
    });
    window.addEventListener('pointerup', ()=>{ dragging=false; growing=false; });

    const holdBtn = document.getElementById('holdBtn');
    holdBtn.addEventListener('pointerdown', e=>{ e.stopPropagation(); growing = true; });

    const spinBtn = document.getElementById('spinBtn');
    spinBtn.onclick = ()=>{ spinning=!spinning; spinBtn.classList.toggle('on', spinning); };
    document.getElementById('resetBtn').onclick = ()=> setProgress(0.02);
    document.getElementById('shotBtn').onclick = ()=>{
        const a=document.createElement('a');
        a.href = renderer.domElement.toDataURL('image/png');
        a.download = 'pastacrochet.png'; a.click();
    };
    const chartBtnEl = document.getElementById('chartBtn');
    const chartPanel = document.getElementById('chartPanel');
    chartBtnEl.onclick = ()=>{ chartPanel.classList.toggle('hide'); chartBtnEl.classList.toggle('on', !chartPanel.classList.contains('hide')); };

    // ================= 織圖即時變色（SVG fill 替換） =================
    function shadeHex(hex, amt){
        const n=parseInt(hex.slice(1),16);
        const cl=v=>Math.max(0,Math.min(255,v));
        return '#'+[cl((n>>16)+amt),cl(((n>>8)&255)+amt),cl((n&255)+amt)].map(v=>v.toString(16).padStart(2,'0')).join('');
    }
    let chartGroups = null;    // 桜 SVG：藍=round 主色、橙=邊緣 round、黑=輪廓(不動)
    fetch('../crochet_library/doily_桜.svg').then(r=>r.text()).then(txt=>{
        const box = document.getElementById('chartBox');
        box.innerHTML = txt;
        const svg = box.querySelector('svg');
        svg.removeAttribute('width'); svg.removeAttribute('height');
        chartGroups = { body:[], accent:[] };
        svg.querySelectorAll('[fill]').forEach(el=>{
            const f = (el.getAttribute('fill')||'').toUpperCase();
            if(f==='#7E9BF8') chartGroups.body.push(el);
            else if(f==='#E08529') chartGroups.accent.push(el);
        });
        applyChartColor();
    }).catch(()=>{ document.getElementById('chartBox').textContent = '（織圖載入失敗）'; });

    let currentSauce = sauces['紅醬'];
    function applyChartColor(){
        if(!chartGroups) return;
        chartGroups.body.forEach(el=> el.setAttribute('fill', currentSauce.color));
        chartGroups.accent.forEach(el=> el.setAttribute('fill', shadeHex(currentSauce.color, -55)));
    }

    // ================= 醬料 dock =================
    const dock = document.getElementById('saucedock');
    Object.entries(sauces).forEach(([name,s],i)=>{
        const b=document.createElement('button');
        b.innerHTML = `<span class="sw" style="background:${s.color}"></span>${name}`;
        if(i===0) b.classList.add('on');
        b.onclick = ()=>{
            [...dock.children].forEach(c=>c.classList.remove('on'));
            b.classList.add('on');
            currentSauce = s;
            yarnMat.color.set(s.color);
            yarnMat.roughness = s.rough;
            yarnMat.clearcoat = s.coat;
            applyChartColor();
        };
        dock.appendChild(b);
    });

    // ================= Loop =================
    function updateToppings(dt){
        toppings.forEach(m=>{
            const u=m.userData;
            if(u.t<0 && served){ u.t+=dt; return; }
            if(!served) return;
            u.t=Math.min(1,u.t+dt*2.2);
            if(u.t<=0) return;
            const e=1-Math.pow(1-u.t,3);
            m.position.y = 9+(u.targetY-9)*e;
            m.scale.set(e, e*u.squash+(1-u.squash)*e*e, e);
        });
    }
    let last=performance.now();
    function loop(now){
        const dt=Math.min(.05,(now-last)/1000); last=now;
        if(growing) setProgress(progress+dt*0.15);
        if(spinning && !dragging){ azim+=dt*0.22; updateCamera(); }
        updateToppings(dt);
        renderer.render(scene,camera);
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    window.addEventListener('resize', ()=>{
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 驗證掛鉤（headless rAF 不觸發時用）
    window.__poc = {
        setProgress, getProgress:()=>progress, served:()=>served,
        setSauce:n=>{ const s=sauces[n]; currentSauce=s; yarnMat.color.set(s.color); yarnMat.roughness=s.rough; yarnMat.clearcoat=s.coat; applyChartColor(); },
        renderOnce:()=>renderer.render(scene,camera),
        stepAnim:s=>{ for(let i=0;i<s*60;i++) updateToppings(1/60); },
        chartReady:()=>!!chartGroups,
        chartFillSample:()=> chartGroups ? { body: chartGroups.body[0]?.getAttribute('fill'), accent: chartGroups.accent[0]?.getAttribute('fill'), bodyCount: chartGroups.body.length, accentCount: chartGroups.accent.length } : null,
        renderer
    };
    </script>
</body>

</html>

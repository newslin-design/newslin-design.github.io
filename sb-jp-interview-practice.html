<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solution Builder JP 訪談練習室</title>
<style>
:root{--bg:#f3f5f4;--paper:#fff;--ink:#172124;--muted:#657378;--line:#d8e0df;--teal:#087d82;--soft:#e4f2f1;--blue:#eaf0fa;--amber:#fff2d7;--green:#e7f4ea;--red:#f9e8e5;--shadow:0 10px 35px rgba(20,39,42,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans TC","Yu Gothic UI",Meiryo,system-ui,sans-serif;line-height:1.6}button,input,select{font:inherit}.shell{max-width:1120px;margin:auto;padding:34px 22px 90px}.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:22px}.eyebrow{margin:0 0 4px;color:var(--teal);font-size:12px;font-weight:800;letter-spacing:.14em}.hero h1{font-size:clamp(25px,4vw,40px);line-height:1.15;margin:0}.hero p{margin:9px 0 0;color:var(--muted)}.progress{text-align:right;min-width:150px}.progress strong{font-size:28px}.bar{height:7px;background:var(--line);border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--teal);transition:.25s}.notice{margin:18px 0;padding:12px 15px;background:var(--amber);border-radius:9px;font-size:13px}.controls{position:sticky;top:0;z-index:5;background:rgba(243,245,244,.94);backdrop-filter:blur(12px);padding:12px 0}.control-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.control-row+ .control-row{margin-top:9px}.field{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}select.field{max-width:260px}.search{flex:1;min-width:220px}.pill,.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;cursor:pointer;color:var(--ink)}.pill.active,.btn.primary{background:var(--ink);border-color:var(--ink);color:white}.btn{border-radius:8px}.btn:hover,.pill:hover{border-color:var(--teal)}.rate{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.rate input{width:105px}.stats{font-size:12px;color:var(--muted);margin-left:auto}.section-title{display:flex;gap:12px;align-items:baseline;margin:30px 0 12px}.section-title span{color:var(--teal);font-size:12px;font-weight:800;letter-spacing:.1em}.section-title h2{margin:0;font-size:21px}.grid{display:grid;gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}.card.done{border-color:#7fb68d}.card-head{padding:16px 18px 13px}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.question{font-size:19px;font-weight:750;line-height:1.55;margin:7px 0 4px}.intent{color:var(--muted);font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.speak{background:var(--soft);color:#075a5e;border-color:#b8dcd9}.card-body{border-top:1px solid var(--line);padding:15px 18px;background:#fbfcfc}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.answer{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--paper)}.answer-label{font-size:11px;font-weight:800;color:var(--teal);letter-spacing:.08em}.jp{font-size:15px;margin:5px 0}.zh{font-size:12px;color:var(--muted)}.follow{margin-top:10px;padding:10px;border-radius:8px;background:var(--green)}.follow b,.counter b{font-size:11px;letter-spacing:.06em}.follow .jp{font-weight:650}.counter{margin-top:10px;padding:10px;border-radius:8px;background:var(--blue)}.practice{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.check{display:flex;align-items:center;gap:8px;font-size:13px}.empty{text-align:center;color:var(--muted);padding:60px 10px}.dialog{border:0;border-radius:14px;padding:0;max-width:650px;width:calc(100% - 30px);box-shadow:0 22px 80px rgba(0,0,0,.25)}.dialog::backdrop{background:rgba(8,18,20,.55)}.dialog-inner{padding:22px}.dialog h3{margin:0}.dialog .prompt{font-size:13px;color:var(--muted)}.roleplay-answer{margin:18px 0;padding:18px;background:var(--soft);border-radius:10px;font-size:18px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.kbd{font-family:ui-monospace,monospace;background:#eef1f1;border:1px solid var(--line);padding:1px 5px;border-radius:4px;font-size:11px}@media(max-width:700px){.hero{grid-template-columns:1fr}.progress{text-align:left}.answers{grid-template-columns:1fr}.question{font-size:17px}.stats{width:100%;margin:0}}@media print{.controls,.actions,.notice,.dialog{display:none!important}.shell{padding:15px}.card{break-inside:avoid;box-shadow:none}.card-body{display:block!important}}
</style>
</head>
<body>
<main class="shell">
  <header class="hero"><div><p class="eyebrow">JP INTERVIEW PRACTICE LAB</p><h1>Solution Builder 日文訪談練習室</h1><p>逐題聽問題、辨識可能回答，再選擇合適的追問。</p></div><div class="progress"><strong id="doneCount">0</strong> / <span id="totalCount">0</span><div class="bar"><i id="bar"></i></div><small>已熟練</small></div></header>
  <div class="notice">🔊 TTS 使用瀏覽器內建語音，不會上傳內容。請優先選擇名稱含「Japanese」「日本語」或「ja-JP」的聲音；若清單沒有日文語音，可改用 Edge 或 Chrome。</div>
  <section class="controls" aria-label="練習控制"><div class="control-row" id="filters"></div><div class="control-row"><input id="search" class="field search" placeholder="搜尋日文、中文、題號…"><select id="voice" class="field" aria-label="TTS 語音"></select><label class="rate">語速 <input id="rate" type="range" min="0.55" max="1.25" step="0.05" value="0.85"><span id="rateText">0.85×</span></label><button class="btn" id="stop">停止</button><button class="btn primary" id="random">🎭 隨機聽力模擬</button><span class="stats" id="visibleCount"></span></div></section>
  <div id="app"></div>
</main>
<dialog class="dialog" id="roleDialog"><div class="dialog-inner"><p class="eyebrow" id="roleMeta"></p><h3 id="roleQuestion"></h3><p class="prompt">先不要看逐字稿。聽完後，請在 3 秒內說出追問。</p><div class="roleplay-answer" id="roleAnswer">按「播放回答」開始</div><div class="dialog-actions"><button class="btn" id="closeDialog">結束</button><button class="btn speak" id="playRole">▶ 播放回答</button><button class="btn" id="revealRole">顯示逐字稿</button><button class="btn primary" id="nextRole">下一題</button></div></div></dialog>
<script>
const sections={warm:'暖身',story:'① 真實專案故事線',customer:'② 日本客戶畫像',pain:'③ 內部痛點與許願',permission:'④ 權限示範'};
const C=(id,section,goal,q,zh,a1,z1,f1,a2,z2,f2,counter)=>({id,section,goal,q,zh,answers:[{jp:a1,zh:z1,follow:f1},{jp:a2,zh:z2,follow:f2}],counter});
const cards=[
C("W-1","warm","角色","今、JPでは、どんな役割の方が Solution Builder を使っていますか。Sales、SE、テクニカルサポート、そのほかにもいらっしゃいますか。","確認實際使用者角色。","主にセールスとSEが使っています。セールスがたたき台を作って、技術的なところはSEが確認します。","主要是業務與SE使用；業務先做草稿，SE確認技術內容。","セールスとSEでは、使う機能や困るところに違いはありますか。","今のところ、ほとんどSEだけですね。お客様との打ち合わせの前に構成を作っています。","目前幾乎只有SE，會前先建立配置。","ほかの役割の方が使っていないのは、なぜでしょうか。"),
C("W-2","warm","主要使用者","その中で、一番よく使っているのはどの役割の方ですか。","找出核心使用族群。","プリセールスのSEが一番よく使っています。","售前SE最常用。","具体的には、どの業務で使うことが多いですか。","担当者によって違いますが、営業が使うことのほうが多いです。","依人而異，但業務用得較多。","よく使う方と使わない方では、何が違うと思いますか。"),
C("W-3","warm","頻率","頻度はどのくらいでしょうか。週に何回、あるいは月に何回くらいですか。","取得可量化頻率。","案件がある週は、二、三回くらい使います。","有案子的週大約使用兩三次。","直近で使ったのは、いつ頃、どの案件でしたか。","毎月ではなく、大きな案件が入ったときだけです。二、三か月に一度くらいです。","只在大型案件使用，約兩三個月一次。","使う頻度が低いのは、案件が少ないからですか。それとも、ほかのツールを使うからですか。"),
C("W-4","warm","使用場景","どんな案件のときに使うことが多いですか。","界定最常見場景。","複数の製品を組み合わせる、少し複雑な案件で使います。","會在多產品組合的複雜案件使用。","最近の具体的な案件を一つ教えていただけますか。","お客様に構成を分かりやすく見せたいときに使います。","需要讓客戶容易理解配置時使用。","どの段階で使いますか。初回提案の前ですか、それとも要件が固まったあとですか。"),

C("S-0","story","案例選擇","最近の案件の中から、お客様とのやり取りが一番多かったものを一つ選んでください。","鎖定一個真實案例，後續全部沿用。","先月の会議室リニューアル案件が一番やり取りが多かったです。","上月的會議室翻新案互動最多。","その案件について、最初にご要望が入ったところから教えてください。","具体的な社名は言えませんが、教育関係のお客様の案件があります。","不能說客戶名，但有教育產業案例。","社名は伏せたままで大丈夫です。どのような案件だったか教えてください。",{q:"どんな案件でもいいですか。",a:"はい。うまくいった案件でも、大変だった案件でも大丈夫です。"}),
C("S-1","story","需求入口","まず、その案件のご要望は、どうやって入ってきましたか。メールでしょうか、それとも打ち合わせの場でしたか。","確認需求入口與原始資料。","代理店からメールで製品リストと簡単な要件が送られてきました。","代理商用郵件提供產品清單與簡要需求。","そのメールには、どの程度具体的な情報が入っていましたか。","最初はオンライン会議で相談を受けて、そのあと図面をいただきました。","先在線上會議收到諮詢，之後拿到圖面。","最初の打ち合わせで、誰がどのように要件を整理しましたか。"),
C("S-2","story","建檔者","Solution Builder のプロジェクトは、どなたが作りましたか。JPの方ですか、それともお客様ご自身ですか。","找出實際建檔者與分工。","私が作りました。お客様から情報をもらって、こちらで入力しました。","受訪者建立，依客戶資料輸入。","作成には、どのくらい時間がかかりましたか。","お客様が最初に作って、途中から私たちが引き継ぎました。","客戶先建立，途中由JP接手。","どの段階で、なぜ引き継ぐことになりましたか。"),
C("S-3","story","起始方式","作るときは、白紙から始めましたか。それとも、既存の Golden Template をコピーして修正しましたか。","確認是否重用範本。","似た構成のテンプレートがあったので、それをコピーしました。","複製相似範本。","そのテンプレートは、誰が作ったものですか。","条件に合うテンプレートがなかったので、白紙から作りました。","沒有合適範本，從空白建立。","白紙から作る場合、最初に何を決める必要がありますか。"),
C("S-4","story","範本治理","そのテンプレートは、誰が作ったものですか。どのくらいの頻度で更新していますか。","若用了範本，追問所有權與維護。","本社が作ったものを使っています。更新のタイミングはよく分かりません。","使用總公司範本，不清楚更新時機。","更新されたことは、どのように知りますか。","JPチームで作りましたが、担当者が必要なときに修正するだけです。","JP自建，但只由負責人按需修改。","チーム内で、最新版をどのように共有していますか。"),
C("S-5","story","內容確認","プロジェクトを作ったあと、お客様とはどうやって内容を確認しますか。","還原討論與確認方式。","オンライン会議で画面を共有して、一つずつ確認します。","在線上會議共享畫面逐項確認。","その場で決まらない項目は、どのように管理しますか。","PDFに出力してメールで送り、コメントを返してもらいます。","輸出PDF寄送，請客戶回覆意見。","コメントを受け取ったあと、誰が Solution Builder に反映しますか。"),
C("S-6","story","共同編輯","画面を共有しながら、その場で直しますか。それとも、お客様がご自分で編集されますか。","確認協作模式與責任。","画面共有中に私が修正します。お客様は基本的に見ているだけです。","受訪者在共享畫面時修改，客戶只觀看。","その場で直すとき、一番時間がかかる操作は何ですか。","URLを共有して、お客様にも一部を編集してもらいました。","分享連結，讓客戶編輯部分內容。","同時に編集したとき、困ったことはありませんでしたか。"),
C("S-7","story","修改次數","その案件では、修正は何回くらいありましたか。","量化返工頻率。","大きな修正が三回、細かい修正は五回以上ありました。","大改三次，小改五次以上。","一番大きな修正は、何が原因でしたか。","一度だけです。最初に要件をかなり細かく確認していました。","只修改一次，因為一開始確認得很細。","最初に確認しておくと修正が減る項目は、何ですか。"),
C("S-8","story","版本管理","どれが最新のバージョンか分からなくなって、困ったことはありますか。","挖掘版本混亂與後果。","あります。一度、古い構成で見積りを出してしまいました。","曾用舊配置報價。","最近だと、いつ頃でしたか。そのときは、どうやって解決しましたか。","今はファイル名に日付を入れているので、大きな問題はありません。","目前用檔名日期管理，沒有大問題。","そのルールは、チーム全員が同じように使っていますか。"),
C("S-9","story","輸出內容","話し合いが終わったあと、何を出力しますか。接続図ですか、製品リストですか、それとも両方ですか。","確認實際交付物。","接続図と製品リストの両方をPDFで出力します。","連線圖及產品清單都輸出成PDF。","それぞれ、誰が、何のために使いますか。","接続図だけです。製品リストは別のExcelで作ります。","只輸出連線圖，清單另做Excel。","製品リストを別のExcelで作るのは、なぜでしょうか。"),
C("S-10","story","二次加工","出力したあと、PowerPointやExcel、Visioに作り直すことはありますか。","找出重工與外部工具依賴。","ほぼ毎回、PowerPointの提案書に貼り直します。","幾乎每次都貼到PowerPoint提案書。","貼り直しているのは、図だけですか。それとも製品情報もですか。","複雑な案件だけ、Visioで図を整え直します。","只有複雜案會用Visio重整圖面。","最近の案件では、整え直すのにどのくらい時間がかかりましたか。"),
C("S-11","story","重工原因","それは、なぜですか。","不要接受表面答案，找出缺口。","会社指定のフォーマットとデザインがあるからです。","公司有指定格式及設計。","そのフォーマットに必要で、Solution Builderの出力にないものは何ですか。","お客様に見せるには、図が少し分かりにくいからです。","圖面對客戶而言不夠清楚。","具体的に、どの部分が分かりにくいと言われますか。"),
C("S-12","story","報價流程","最終的に、そのファイルから見積りまでは、どのような流れで進みますか。誰が、どのシステムに入力しますか。","接通輸出到報價的最後一哩。","営業が製品リストを見ながら、販売管理システムに手入力します。","業務看產品清單，手動輸入銷售系統。","入力には何分くらいかかりますか。入力ミスが起きることはありますか。","代理店にExcelを送り、代理店側で見積りを作ってもらいます。","把Excel寄給代理商，由對方建立報價。","Excelを送る前に、どなたが内容を確認しますか。"),
C("S-13","story","反事實","もし Solution Builder がまったくなかったら、この案件はどう進めていたと思いますか。","釐清產品真正價值。","Excelで製品を整理して、Visioで構成図を作っていたと思います。","會用Excel整理產品、Visio畫圖。","その方法と比べて、どの作業が一番短くなりましたか。","以前から使っているPowerPointのテンプレートで対応できたと思います。","既有PowerPoint範本也能處理。","それでも Solution Builder を使った理由は何ですか。"),
C("S-14","story","節省工作","Solution Builderを使うことで、具体的にどのような作業が減りましたか。","要求具體效益而非籠統稱讚。","製品画像を探して配置する作業が減りました。二時間くらい短縮できました。","省下搜尋與配置產品圖片，約兩小時。","その二時間は、案件ごとに毎回かかっていた時間ですか。","接続関係を説明する時間が減りました。お客様が図を見れば理解できます。","縮短說明連接關係的時間。","説明時間は、以前と比べてどのくらい減りましたか。"),
C("S-15","story","尚未涵蓋","逆に、まだ Solution Builder では対応できない作業はありますか。","界定產品邊界與缺口。","価格の確認と見積りは、別のシステムで行う必要があります。","價格及報價仍須使用其他系統。","二つのシステムの間で、同じ情報を入力し直していますか。","お客様向けの提案書として仕上げる作業は、まだできません。","仍無法完成客戶版提案書。","提案書にするために、何を追加・修正していますか。"),
C("S-16","story","產品邊界","その作業に必要な機能は、Solution Builderに追加してほしいですか。それとも、別のツールのままでいいですか。","避免把所有功能都塞進產品。","見積りシステムとは連携してほしいですが、提案書の編集はPowerPointのままでいいです。","希望串接報價，但提案書仍用PowerPoint。","見積り連携では、最低限どの情報が渡れば十分ですか。","できれば一つのツールで完結してほしいです。","希望在單一工具完成。","一つだけ先に追加できるとしたら、どの作業を選びますか。",{q:"将来の計画について答えてもらえますか。",a:"今日は現在の使い方を理解するための調査です。将来の計画は、社内で検討したうえで改めて共有します。"}),

C("C-1","customer","自主學習","お客様は、ご自分で触って覚えるタイプが多いですか。それとも、JPからの説明が必要なことが多いですか。","判斷導入所需支援。","説明しなくても触れる方は少なく、最初にデモが必要です。","很少人能自行摸索，通常需要示範。","デモでは、必ず説明している操作は何ですか。","SIerの方はご自分で試しますが、エンドユーザーは説明を待つことが多いです。","SIer會自己試，終端客戶多半等說明。","SIerとエンドユーザーでは、つまずく場所も違いますか。"),
C("C-2","customer","卡點","お客様が一番つまずくのは、どの場面ですか。","定位具體可用性問題。","製品を検索して、正しいモデルを選ぶところです。","搜尋並選擇正確型號時卡住。","製品が探せないのですか。それとも、どれを選ぶべきか分からないのですか。","機器同士を接続する操作が分かりにくいようです。","不清楚如何連接設備。","最近、その操作で止まったお客様は、どんな画面を見ていましたか。"),
C("C-3","customer","求助時機","どんなときに「助けてほしい」と連絡が来ますか。","取得支援場景與頻率。","エラーが出たときより、次に何をすればいいか分からないときに連絡が来ます。","不是錯誤，而是不知道下一步時求助。","直近では、どの画面で連絡が来ましたか。","作ったプロジェクトを共有できないときに問い合わせが来ます。","無法分享專案時來詢問。","その問い合わせは、月に何回くらいありますか。"),
C("C-4","customer","正面回饋","お客様が「これは便利だ」と言ってくださった機能はありますか。","收集具體價值證據。","製品画像を使って構成を見せられる点が分かりやすいと言われます。","客戶認為用產品圖呈現配置很清楚。","最近、どのようなお客様から言われましたか。","製品リストが自動で出るところが便利だと言われました。","自動產生產品清單很方便。","その機能を使う前は、どのようにリストを作っていましたか。"),
C("C-5","customer","明確抱怨","逆に、「ここを直してほしい」と、はっきり言われたことはありますか。","區分直接回饋與內部推測。","ケーブルも自動で選んでほしいと言われました。","客戶明確要求自動選擇線材。","その要望は、一人のお客様からですか。ほかにもありましたか。","文字が小さくて見づらいと言われたことがあります。","有人說文字太小難閱讀。","どの画面、どの端末で見づらかったのでしょうか。"),
C("C-6","customer","合適客群","どんなお客様が、Solution Builderに向いていると思いますか。","定義目標客群。","複数メーカーの製品を扱うSIerに向いていると思います。","適合處理多品牌產品的SIer。","その中でも、特にどのような案件を持つSIerでしょうか。","製品知識は少ないけれど、構成を自分で検討したいお客様です。","產品知識較少但想自行規劃配置的客戶。","そのお客様が一人で使うには、どんな支援が必要ですか。"),
C("C-7","customer","技術門檻","技術のレベルは、どのくらい必要でしょうか。","了解使用門檻。","基本的なAVの知識があれば使えると思います。","有基本AV知識即可。","基本的な知識とは、具体的に何が分かればよいですか。","今の状態だと、ATEN製品に詳しくないと難しいです。","目前必須熟悉ATEN產品。","製品知識がなくても選べるようにするには、何が必要ですか。"),
C("C-8","customer","潛在使用者","今は使っていないけれど、実は Solution Builderに向いているというお客様はいますか。","找出未滲透但適合的客群。","地方の小規模なSIerは向いていると思いますが、まだ紹介できていません。","地方小型SIer適合，但尚未推廣。","紹介できていない理由は、時間ですか。それとも別の理由ですか。","社内の若い営業担当者にも向いていると思います。","公司內年輕業務也適合。","今、その方たちは代わりに何を使っていますか。"),
C("C-9","customer","未採用原因","それは、なぜ今は使っていないのでしょうか。","釐清採用障礙。","ログイン方法が分かりにくく、最初の案内で止まっています。","登入方式不清楚，卡在最初引導。","実際に、何人くらいがそこで止まりましたか。","既存のやり方で困っていないので、新しいツールを覚える理由がありません。","既有方式沒困擾，沒有學新工具的理由。","どんな価値があれば、試してもらえると思いますか。"),
C("C-10","customer","推廣障礙","本格的にお客様へ展開するとしたら、一番の障害は何だと思いますか。","找出規模化推廣最大阻力。","日本語のマニュアルとサポート体制が足りないことです。","日文文件及支援體系不足。","最初に一つだけ用意するなら、どんなサポートが必要ですか。","お客様向けに公開してよいテンプレートが整理されていません。","尚未整理可公開給客戶的範本。","公開可否は、誰が、どの基準で判断しますか。"),

C("P-1","pain","最佳案例","これまでで、「これが Solution Builderの一番いい使い方だ」と感じた案件はありますか。","確認理想使用模式。","ショールームで、お客様と一緒に構成を作った案件です。","在展示間與客戶共同建立配置。","その使い方がよかったのは、どの点でしょうか。","新人の営業が、SEに確認する前のたたき台を作れた案件です。","新人業務能先做草稿再請SE確認。","以前の進め方と比べて、何が変わりましたか。"),
C("P-2","pain","最痛流程","お客様の要望、設計、社内レビュー、見積り、共有、変更。この流れの中で、どこが一番大変ですか。","強迫在完整流程中選出最大痛點。","変更が入ったあと、図と見積りを両方直すところです。","需求變更後要同時修改圖與報價最麻煩。","一回の変更で、どのくらい時間がかかりますか。どのくらいの頻度で起きますか。","社内レビューです。確認する人によって、見るポイントが違います。","內部審查最困難，不同人檢查重點不同。","最近、手戻りが起きた具体的な例を教えてください。",{q:"一つに絞る必要がありますか。",a:"まず一番大変なところを一つ選んでください。そのあと、ほかの箇所も伺います。"}),
C("P-3","pain","唯一優先","もしリソースが限られていて、一つだけ優先的に改善できるとしたら、どれを選びますか。","逼出真正優先級。","付属品とケーブルの自動レコメンドです。毎回確認に時間がかかります。","優先自動推薦配件與線材，因每次都花時間。","今は、何を見ながら、どのように確認していますか。","バージョン管理です。間違ったファイルを使うリスクが高いからです。","優先版本管理，因誤用檔案風險高。","直近で問題が起きたのはいつですか。どのような影響がありましたか。",{q:"今後、どの機能を開発する予定ですか。",a:"今日のご意見も含めて優先順位を検討します。現時点では、まだ確定していません。"}),
C("P-4","pain","選擇理由","それを選んだ理由も教えていただけますか。","追到時間、頻率、風險與影響。","毎週発生し、一件あたり三十分ほどかかるからです。","每週發生，每案約耗費30分鐘。","その三十分の中で、最も時間がかかる作業は何ですか。","頻度は高くありませんが、間違えたときのお客様への影響が大きいからです。","頻率不高，但出錯時客戶影響很大。","最近起きた例と、そのときの影響を教えてください。"),
C("P-5","pain","遺漏事項","今日お聞きできなかったことで、開発チームに伝えたいことはありますか。小さなことでも大丈夫です。","最後撈出被忽略的小痛點。","検索条件を毎回設定し直すのが、少し面倒です。","每次重設搜尋條件有點麻煩。","どの条件をよく使いますか。直近ではいつ起きましたか。","特にありません。だいたいお話しできました。","沒有，差不多都說完了。","ありがとうございます。では、今日のお話の中で、一番重要だと思う点をもう一度教えていただけますか。"),

C("G-1","permission","操作示範","以前お話しいただいたグループ権限の設定について、画面を共有していただきながら、5分ほど教えていただけますか。","請大西實際示範，不只口述。","はい。まず管理画面を開いて、グループを選びます。","先進管理畫面並選群組。","このグループは、どのような単位で分けていますか。","今は実際の環境を共有できないので、口頭で説明します。","目前無法分享實際環境，只能口頭說明。","分かりました。可能であれば、個人情報を隠したテスト環境や資料で流れだけ見せていただけますか。",{q:"実際のお客様情報が見えても大丈夫ですか。",a:"個人情報や機密情報は表示しないでください。難しければ、口頭での説明だけでも大丈夫です。"}),
C("G-2","permission","理解確認","すみません、今の操作は、〇〇のためという理解で合っていますか。","示範過程即時確認目的與規則。","はい、その理解で合っています。この設定で編集できる人を制限します。","理解正確，此設定限制可編輯者。","閲覧だけできる方は、どこで設定しますか。","少し違います。これはユーザーではなく、プロジェクト側の設定です。","不完全正確，這是專案側而非使用者側設定。","ありがとうございます。ユーザー側の権限とは、どのように関係しますか。")
];
let active='all',voices=[],roleCard=null,roleReply=null;
const saved=new Set(JSON.parse(localStorage.getItem('sb-jp-practice-done')||'[]'));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function loadVoices(){voices=speechSynthesis.getVoices();const sel=document.querySelector('#voice');const ja=voices.filter(v=>v.lang.toLowerCase().startsWith('ja'));const list=ja.length?ja:voices;sel.innerHTML=list.map((v,i)=>'<option value="'+voices.indexOf(v)+'">'+esc(v.name)+' · '+esc(v.lang)+'</option>').join('');const preferred=list.find(v=>/nanami|haruka|kyoko|japanese|日本/i.test(v.name))||list[0];if(preferred)sel.value=voices.indexOf(preferred)}
speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
function speak(text,onend){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/Solution Builder/g,'ソリューションビルダー').replace(/Golden Template/g,'ゴールデンテンプレート').replace(/JP/g,'ジェイピー'));u.lang='ja-JP';u.rate=Number(document.querySelector('#rate').value);const v=voices[Number(document.querySelector('#voice').value)];if(v)u.voice=v;if(onend)u.onend=onend;speechSynthesis.speak(u)}
function answerHTML(a,i){return '<div class="answer"><div class="answer-label">可能回答 '+(i+1)+'</div><div class="jp">'+esc(a.jp)+'</div><div class="zh">'+esc(a.zh)+'</div><div class="actions"><button class="btn speak" data-say="'+esc(a.jp)+'">▶ 聽回答</button></div><div class="follow"><b>建議追問</b><div class="jp">'+esc(a.follow)+'</div><button class="btn speak" data-say="'+esc(a.follow)+'">▶ 聽追問</button></div></div>'}
function cardHTML(c){const counter=c.counter?'<div class="counter"><b>對方可能反問 NEW</b><div class="jp">'+esc(c.counter.q)+'</div><div class="zh">建議回答：'+esc(c.counter.a)+'</div><button class="btn speak" data-say="'+esc(c.counter.q)+'">▶ 聽反問</button></div>':'';return '<article class="card '+(saved.has(c.id)?'done':'')+'" data-id="'+c.id+'"><div class="card-head"><div class="meta"><span>'+esc(c.id)+' · '+esc(sections[c.section])+'</span><span>'+esc(c.goal)+'</span></div><div class="question" lang="ja">'+esc(c.q)+'</div><div class="intent">'+esc(c.zh)+'</div><div class="actions"><button class="btn speak" data-say="'+esc(c.q)+'">▶ 聽主問題</button><button class="btn" data-toggle>顯示可能回答</button><button class="btn" data-sim>🎭 只聽隨機回答</button></div></div><div class="card-body" hidden><div class="answers">'+c.answers.map(answerHTML).join('')+'</div>'+counter+'<div class="practice"><label class="check"><input type="checkbox" data-done '+(saved.has(c.id)?'checked':'')+'> 這題我能聽懂並追問</label><span class="intent">先自己說，再播放建議追問</span></div></div></article>'}
function render(){const term=document.querySelector('#search').value.trim().toLowerCase();const filtered=cards.filter(c=>(active==='all'||c.section===active)&&(!term||JSON.stringify(c).toLowerCase().includes(term)));const grouped={};filtered.forEach(c=>(grouped[c.section]??=[]).push(c));document.querySelector('#app').innerHTML=Object.entries(grouped).map(([s,list])=>'<section><div class="section-title"><span>'+esc(s.toUpperCase())+'</span><h2>'+esc(sections[s])+'</h2></div><div class="grid">'+list.map(cardHTML).join('')+'</div></section>').join('')||'<div class="empty">找不到符合條件的題目</div>';document.querySelector('#visibleCount').textContent='顯示 '+filtered.length+' / '+cards.length+' 題';updateProgress()}
function updateProgress(){document.querySelector('#doneCount').textContent=saved.size;document.querySelector('#totalCount').textContent=cards.length;document.querySelector('#bar').style.width=(saved.size/cards.length*100)+'%'}
document.querySelector('#filters').innerHTML='<button class="pill active" data-filter="all">全部</button>'+Object.entries(sections).map(([k,v])=>'<button class="pill" data-filter="'+k+'">'+v+'</button>').join('');
document.querySelector('#filters').onclick=e=>{if(!e.target.dataset.filter)return;active=e.target.dataset.filter;document.querySelectorAll('.pill').forEach(b=>b.classList.toggle('active',b===e.target));render()};
document.querySelector('#search').oninput=render;document.querySelector('#rate').oninput=e=>document.querySelector('#rateText').textContent=Number(e.target.value).toFixed(2)+'×';document.querySelector('#stop').onclick=()=>speechSynthesis.cancel();
document.querySelector('#app').onclick=e=>{const say=e.target.dataset.say;if(say){speak(say);return}const card=e.target.closest('.card');if(!card)return;if(e.target.hasAttribute('data-toggle')){const body=card.querySelector('.card-body');body.hidden=!body.hidden;e.target.textContent=body.hidden?'顯示可能回答':'收起可能回答'}if(e.target.hasAttribute('data-sim'))openRole(cards.find(c=>c.id===card.dataset.id))};
document.querySelector('#app').onchange=e=>{if(!e.target.hasAttribute('data-done'))return;const card=e.target.closest('.card');e.target.checked?saved.add(card.dataset.id):saved.delete(card.dataset.id);localStorage.setItem('sb-jp-practice-done',JSON.stringify([...saved]));card.classList.toggle('done',e.target.checked);updateProgress()};
function openRole(c){roleCard=c;roleReply=c.answers[Math.floor(Math.random()*c.answers.length)];document.querySelector('#roleMeta').textContent=c.id+' · '+sections[c.section];document.querySelector('#roleQuestion').textContent=c.q;document.querySelector('#roleAnswer').textContent='按「播放回答」開始';const d=document.querySelector('#roleDialog');if(!d.open)d.showModal()}
document.querySelector('#playRole').onclick=()=>speak(roleReply.jp);document.querySelector('#revealRole').onclick=()=>document.querySelector('#roleAnswer').innerHTML='<b>回答：</b> '+esc(roleReply.jp)+'<br><br><b>建議追問：</b> '+esc(roleReply.follow);document.querySelector('#nextRole').onclick=()=>openRole(cards[Math.floor(Math.random()*cards.length)]);document.querySelector('#random').onclick=()=>openRole(cards[Math.floor(Math.random()*cards.length)]);document.querySelector('#closeDialog').onclick=()=>{speechSynthesis.cancel();document.querySelector('#roleDialog').close()};
render();
</script>
</body>
</html>

                </div>
                <div class="compatibility-item bad">

            <button class="btn restart-btn" onclick="restartQuiz()">重新測驗</button>

        let currentQuestion = 0;
        let scores = [0, 0, 0, 0]; // [T/I, S/L, D/E, M/F]
        const totalQuestions = questions.length;

        function generateQuestions() {
            const container = document.getElementById('questionContainer');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-container';
                questionDiv.id = `q${index}`;
                if (index === 0) questionDiv.classList.add('active');

                const optionsHtml = q.options.map((option, optionIndex) => `
                    <div class="option" data-score='${JSON.stringify(option.score)}' onclick="selectOption(this)">
                        <span class="food-icon">${option.icon}</span>
                        ${option.text}
                    </div>
                `).join('');

                questionDiv.innerHTML = `
                    <div class="question-emoji">${q.emoji}</div>
                    <div class="question">
                        <h2>${q.question}</h2>
                        <div class="options">
                            ${optionsHtml}
                        </div>
                    </div>
                `;

                container.appendChild(questionDiv);
            });
        }

        function selectOption(option) {
            // 清除同組其他選項的選中狀態
            const siblings = option.parentElement.querySelectorAll('.option');
            siblings.forEach(s => s.classList.remove('selected'));

            // 選中當前選項
            option.classList.add('selected');

            // 記錄分數
            const score = JSON.parse(option.dataset.score);

            // 啟用下一題按鈕
            document.getElementById('nextBtn').disabled = false;

            // 如果是最後一題，改變按鈕文字
            if (currentQuestion === totalQuestions - 1) {
                document.getElementById('nextBtn').textContent = '查看結果';
            }
        }

        function nextQuestion() {
            // 獲取當前選中的選項並累加分數
            const selectedOption = document.querySelector(`#q${currentQuestion} .option.selected`);
            if (selectedOption) {
                const score = JSON.parse(selectedOption.dataset.score);
                for (let i = 0; i < 4; i++) {
                    scores[i] += score[i];
                }
            }

            if (currentQuestion < totalQuestions - 1) {
                // 隱藏當前題目
                document.getElementById(`q${currentQuestion}`).classList.remove('active');

                // 顯示下一題
                currentQuestion++;
                document.getElementById(`q${currentQuestion}`).classList.add('active');

                // 更新進度條
                updateProgress();

                // 更新問題計數器
                document.getElementById('questionCounter').textContent = `問題 ${currentQuestion + 1} / ${totalQuestions}`;

                // 重置按鈕狀態
                document.getElementById('nextBtn').disabled = true;

            } else {
                // 顯示結果
                showResult();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / totalQuestions) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function showResult() {
            // 隱藏最後一題
            document.getElementById(`q${currentQuestion}`).classList.remove('active');

            // 隱藏按鈕和進度條
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('questionCounter').style.display = 'none';
            document.querySelector('.progress-bar').style.display = 'none';

            // 計算結果
            const resultCode = calculateResult();
            const result = types[resultCode];

            // 顯示結果
            if (result) {
                document.getElementById('resultAvatar').src = result.avatar;
                document.getElementById('resultType').textContent = resultCode;
                document.getElementById('resultTitle').textContent = result.name;
                document.getElementById('resultSubtitle').textContent = result.title;
                document.getElementById('resultQuote').textContent = `${result.quote}`;
                document.getElementById('resultFood').textContent = result.food;
                document.getElementById('resultDesc').textContent = result.desc;
                document.getElementById('compatibleTypes').textContent = result.compatible;
                document.getElementById('incompatibleTypes').textContent = result.incompatible;
            }

            // 顯示結果頁面
            document.getElementById('result').classList.add('active');
        }

        function calculateResult() {
            let code = "";
            // 根據分數計算人格類型
            code += scores[0] >= 0 ? "T" : "I";
            code += scores[1] >= 0 ? "S" : "L";
            code += scores[2] >= 0 ? "D" : "E";
            code += scores[3] >= 0 ? "M" : "F";

            console.log("最終分數:", scores);
            console.log("結果代碼:", code);

            return code;
        }

        function restartQuiz() {
            // 重置所有狀態
            currentQuestion = 0;
            scores = [0, 0, 0, 0];

            // 重置UI
            document.getElementById('result').classList.remove('active');
            document.getElementById('q0').classList.add('active');
            document.getElementById('nextBtn').style.display = 'block';
            document.getElementById('nextBtn').textContent = '下一題';
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('questionCounter').style.display = 'block';
            document.getElementById('questionCounter').textContent = '問題 1 / 8';
            document.querySelector('.progress-bar').style.display = 'block';
            document.getElementById('progressFill').style.width = '12.5%';

            // 清除所有選項
            document.querySelectorAll('.option').forEach(option => {
                option.classList.remove('selected');
            });

            // 隱藏其他題目
            for (let i = 1; i < totalQuestions; i++) {
                document.getElementById(`q${i}`).classList.remove('active');
            }
        }

        // 初始化
        function init() {
            generateQuestions();
            updateProgress();

            // scores = [-2, 1, 2, 3]
            // showResult()
        }

        // 頁面載入完成後初始化
        document.addEventListener('DOMContentLoaded', init);


    </script>

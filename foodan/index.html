<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你是什麼美食動物?</title>
    <link rel="stylesheet" href="whichFood.css">
</head>

<body>
    <div class="container">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- 問題容器動態生成 -->
        <div class="question-counter" id="questionCounter"></div>
        <div id="questionContainer"></div>
        <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>下一題</button>
        <!-- 載入動畫 -->
        <div class="loading-container" id="loadingContainer">
            <div class="loading-spinner"></div>
            <div class="loading-text">正在分析...<br>你是哪種美食動物</div>
            <div class="loading-dots">.</div>
        </div>
        <!-- 結果頁面 -->
        <div class="result-container" id="result">
            <div class="result-image">
                <img id="resultAvatar" src="" alt="Avatar">
            </div>
            <div class="result-text-container">
                <div class="header">
                    <div class="result-type" id="resultType" 　></div>
                    <div class="result-title" id="resultTitle"></div>

                    <div class="result-subtitle" id="resultSubtitle"></div>
                    <div class="result-dimensions" id="dimensions"></div>

                    <div class="result-quote" id="resultQuote"></div>
                </div>
                <div class="result-desc" id="resultDesc"></div>
                <div class="result-food" id="resultFood"></div>
                <div class="compatibility-section">
                    <div class="compatibility-item good">
                        <h4　>最適合一起吃飯</h4>
                        <div class="compatibility-types" id="compatibleTypes"></div>
                    </div>
                    <div class="compatibility-item bad">
                        <h4>最不適合一起吃飯</h4>
                        <div class="compatibility-types" id="incompatibleTypes"></div>
                    </div>
                </div>
                <div class="result-btn-container">
                    <button class="btn restart-btn" onclick="restartQuiz()">重新測驗</button>
                    <button class="btn restart-btn" onclick="showNextPersonality(-1)">﹤</button>

                    <button class="btn restart-btn" onclick="showNextPersonality()">下個動物</button>
                </div>
            </div>
        </div>
    </div>
    <script src="foodanData.js"></script>
    <script>


        class FoodPersonalityQuiz {
            constructor(questions, types) {
                this.questions = questions;
                this.types = types;
                this.currentQuestion = 0;
                this.scores = [0, 0, 0, 0]; // [T/I, S/L, D/E, M/F]
                this.currentResultType = null;
                this.totalQuestions = questions.length;
                this.typeKeys = Object.keys(types);

                // DOM 元素引用
                this.elements = {
                    container: document.getElementById('questionContainer'),
                    nextBtn: document.getElementById('nextBtn'),
                    progressFill: document.getElementById('progressFill'),
                    questionCounter: document.getElementById('questionCounter'),
                    progressBar: document.querySelector('.progress-bar'),
                    loadingContainer: document.getElementById('loadingContainer'),
                    result: document.getElementById('result'),
                    resultAvatar: document.getElementById('resultAvatar'),
                    resultType: document.getElementById('resultType'),
                    resultTitle: document.getElementById('resultTitle'),
                    resultSubtitle: document.getElementById('resultSubtitle'),
                    resultQuote: document.getElementById('resultQuote'),
                    resultDesc: document.getElementById('resultDesc'),
                    resultFood: document.getElementById('resultFood'),
                    dimensions: document.getElementById('dimensions'),
                    compatibleTypes: document.getElementById('compatibleTypes'),
                    incompatibleTypes: document.getElementById('incompatibleTypes')
                };

                this.init();
            }

            init() {
                this.generateQuestions();
                this.updateProgress();
                this.updateQuestionCounter();
                this.scores = [0, 0, 0, 0];

                // 綁定事件
                this.elements.nextBtn.onclick = () => this.nextQuestion();

                // 直接顯示結果(測試用)
                // this.scores = [1, 2, -1, -3];
                // this.showResult();
            }

            generateQuestions() {
                this.elements.container.innerHTML = '';

                this.questions.forEach((q, index) => {
                    const questionDiv = document.createElement('div');
                    questionDiv.className = 'question-container';
                    questionDiv.id = `q${index}`;
                    if (index === 0) questionDiv.classList.add('active');

                    const optionsHtml = q.options.map((option, optionIndex) => `
                            <div class="option" data-score='${JSON.stringify(option.score)}' onclick="quiz.selectOption(this)">
                                <span class="food-icon">${option.icon}</span>
                                ${option.text}
                            </div>
                        `).join('');

                    questionDiv.innerHTML = `
                            <div class="question-image" >
                                <img src="${q.img}" alt="q">
                            </div>
                            <div class="question">
                                <h2>${q.question}</h2>
                                <div class="options">
                                    ${optionsHtml}
                                </div>
                            </div>
                        `;

                    this.elements.container.appendChild(questionDiv);
                });
            }

            selectOption(option) {
                // 清除同組其他選項的選中狀態
                const siblings = option.parentElement.querySelectorAll('.option');
                siblings.forEach(s => s.classList.remove('selected'));
                option.classList.add('selected');

                // 啟用下一題按鈕
                this.elements.nextBtn.disabled = false;

                // 如果是最後一題，按鈕顯示:查看結果
                if (this.currentQuestion === this.totalQuestions - 1) {
                    this.elements.nextBtn.textContent = '查看結果';
                }
            }

            nextQuestion() {
                // 獲取當前選中的選項並累加分數
                const selectedOption = document.querySelector(`#q${this.currentQuestion} .option.selected`);
                if (selectedOption) {
                    const score = JSON.parse(selectedOption.dataset.score);
                    for (let i = 0; i < 4; i++) {
                        this.scores[i] += score[i];
                    }
                }

                if (this.currentQuestion < this.totalQuestions - 1) {
                    // 隱藏當前題目
                    document.getElementById(`q${this.currentQuestion}`).classList.remove('active');

                    // 顯示下一題
                    this.currentQuestion++;
                    document.getElementById(`q${this.currentQuestion}`).classList.add('active');

                    // 更新進度條、問題計數器
                    this.updateProgress();
                    this.updateQuestionCounter();

                    // 重置按鈕狀態
                    this.elements.nextBtn.disabled = true;
                } else {
                    // 顯示結果
                    this.showLoadingAndResult();
                }
            }

            showLoadingAndResult() {
                // 隱藏測驗界面
                document.getElementById(`q${this.currentQuestion}`).classList.remove('active');
                this.elements.nextBtn.style.display = 'none';
                this.elements.questionCounter.style.display = 'none';
                this.elements.progressBar.style.display = 'none';

                // 顯示載入動畫
                this.elements.loadingContainer.classList.add('active');

                // 2秒後顯示結果
                setTimeout(() => {
                    this.elements.loadingContainer.classList.remove('active');
                    this.showResult();
                }, 3000);
            }



            updateProgress() {
                const progress = ((this.currentQuestion + 1) / this.totalQuestions) * 100;
                this.elements.progressFill.style.width = progress + '%';
            }

            updateQuestionCounter() {
                this.elements.questionCounter.textContent = `問題 ${this.currentQuestion + 1} / ${this.totalQuestions}`;
            }

            calculateResult() {
                let code = "";
                // 根據分數計算人格類型
                code += this.scores[0] >= 0 ? "T" : "I";
                code += this.scores[1] >= 0 ? "S" : "L";
                code += this.scores[2] >= 0 ? "D" : "E";
                code += this.scores[3] >= 0 ? "M" : "F";

                console.log("最終分數:", this.scores);
                console.log("結果代碼:", code);

                return code;
            }

            // 新增：添加人格代碼CSS類名到html標籤
            addPersonalityClass(personalityCode) {
                const htmlElement = document.documentElement;

                // 移除之前的人格類名（如果存在）
                this.removePersonalityClass();

                // 添加新的人格類名
                htmlElement.classList.add(`personality-${personalityCode.toLowerCase()}`);


                console.log(`添加CSS類名: personality-${personalityCode.toLowerCase()}`);
            }

            // 新增：移除人格代碼CSS類名
            removePersonalityClass() {
                const htmlElement = document.documentElement;

                // 移除所有可能的人格類名
                this.typeKeys.forEach(typeCode => {
                    htmlElement.classList.remove(`personality-${typeCode.toLowerCase()}`);
                });

                // // 移除所有特徵類名
                // const traits = ['t', 'i', 's', 'l', 'd', 'e', 'm', 'f'];
                // traits.forEach(trait => {
                //     htmlElement.classList.remove(`trait-${trait}`);
                // });
            }

            showResult(resultType = null) {
                // 隱藏題目區域
                if (this.currentQuestion < this.totalQuestions) {
                    document.getElementById(`q${this.currentQuestion}`).classList.remove('active');
                }

                // 隱藏按鈕和進度條
                this.elements.nextBtn.style.display = 'none';
                this.elements.questionCounter.style.display = 'none';
                this.elements.progressBar.style.display = 'none';

                // 計算結果
                const resultCode = resultType || this.calculateResult();
                this.currentResultType = resultCode;
                const result = this.types[resultCode];

                // 添加人格代碼CSS類名到html標籤
                this.addPersonalityClass(resultCode);

                // 顯示結果
                if (result) {
                    this.elements.resultAvatar.src = result.avatar;
                    this.elements.resultType.textContent = resultCode;
                    this.elements.resultTitle.textContent = result.name;
                    this.elements.resultSubtitle.textContent = result.title;
                    this.elements.resultQuote.innerHTML = result.quote;
                    this.elements.resultFood.textContent = result.food;

                    this.elements.resultDesc.textContent = result.desc;



                    this.elements.dimensions.innerHTML = result.dimensions.map((dimension, index) => {
                        const score = this.scores[index];

                        const getColor = (s) => {
                            const abs = Math.abs(s);
                            return abs >= 3 ? '#00000099' : abs >= 2 ? '#00000055' : abs >= 1 ? '#00000025' : '#00000011';
                        };

                        return `<span  style=" background-color: ${getColor(score)};color: ${Math.abs(score) >= 2 ? '#ffffffaa' : ''}">${dimension}</span>`;
                    }).join('');




                    // 處理相容性顯示，使其可點擊
                    this.displayCompatibilityTypes('compatibleTypes', result.compatible);
                    this.displayCompatibilityTypes('incompatibleTypes', result.incompatible);
                }

                // 顯示結果頁面
                this.elements.result.classList.add('active');
            }

            displayCompatibilityTypes(elementId, typesString) {
                const element = document.getElementById(elementId);
                const typeNames = typesString.split('、');

                element.innerHTML = '';
                typeNames.forEach((typeName, index) => {
                    const span = document.createElement('span');
                    span.className = 'personality-type';
                    span.textContent = typeName;
                    span.onclick = () => this.showPersonalityByName(typeName);
                    element.appendChild(span);

                    // 如果不是最後一個，添加分隔符
                    if (index < typeNames.length - 1) {
                        const separator = document.createTextNode('、');
                        element.appendChild(separator);
                    }
                });
            }

            showPersonalityByName(personalityName) {
                // 根據人格名稱找到對應的代碼
                const typeCode = Object.keys(this.types).find(key => this.types[key].name === personalityName);
                if (typeCode) {
                    this.showResult(typeCode);
                }
            }

            showNextPersonality(num = 1) {
                // 找到當前人格在列表中的位置
                const currentIndex = this.typeKeys.indexOf(this.currentResultType);
                // 獲取下一個人格（循環到開頭）
                const nextIndex = (currentIndex + num) % this.typeKeys.length;
                const nextType = this.typeKeys[nextIndex];

                this.showResult(nextType);
            }

            restartQuiz() {
                // 移除人格代碼CSS類名
                this.removePersonalityClass();

                // 重置所有狀態
                this.currentQuestion = 0;
                this.scores = [0, 0, 0, 0];
                this.currentResultType = null;

                // 重置UI
                this.elements.result.classList.remove('active');
                document.getElementById('q0').classList.add('active');
                this.elements.nextBtn.style.display = 'block';
                this.elements.nextBtn.textContent = '下一題';
                this.elements.nextBtn.disabled = true;
                this.elements.questionCounter.style.display = 'block';
                this.elements.questionCounter.textContent = `問題 1 / ${this.totalQuestions}`;
                this.elements.progressBar.style.display = 'block';
                this.elements.progressFill.style.width = `${100 / this.totalQuestions}%`;

                // 清除所有選項
                document.querySelectorAll('.option').forEach(option => {
                    option.classList.remove('selected');
                });

                // 隱藏其他題目
                for (let i = 1; i < this.totalQuestions; i++) {
                    document.getElementById(`q${i}`).classList.remove('active');
                }
            }

            // 靜態方法：創建實例的工廠方法
            static create(questions, types) {
                return new FoodPersonalityQuiz(questions, types);
            }

            // 獲取當前狀態的方法
            getCurrentState() {
                return {
                    currentQuestion: this.currentQuestion,
                    scores: [...this.scores],
                    currentResultType: this.currentResultType,
                    isCompleted: this.currentQuestion >= this.totalQuestions
                };
            }

            // 設置狀態的方法（用於復原測驗進度）
            setState(state) {
                this.currentQuestion = state.currentQuestion;
                this.scores = [...state.scores];
                this.currentResultType = state.currentResultType;

                // 更新UI以反映狀態
                this.updateProgress();
                this.updateQuestionCounter();
            }
        }

        // 使用方式：
        // 1. 初始化測驗
        let quiz;

        function initQuiz() {
            quiz = new FoodPersonalityQuiz(questions, types);
        }

        // 2. 全域函數（保持與原始 HTML 的兼容性）
        function selectOption(option) {
            if (quiz) quiz.selectOption(option);
        }

        function nextQuestion() {
            if (quiz) quiz.nextQuestion();
        }

        function restartQuiz() {
            if (quiz) quiz.restartQuiz();
        }

        function showNextPersonality() {
            if (quiz) quiz.showNextPersonality();
        }

        // 3. 頁面載入完成後初始化
        document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
</body>

</html>

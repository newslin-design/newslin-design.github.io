<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式電視牆</title>
    <link rel="stylesheet" href="style.css">


</head>

<body>

    <div class="tv-wall-main-container">
        <!-- 背景影片 -->
        <video class="background-video" autoplay loop muted>
            <source src="elements/Background.mp4" type="video/mp4">
        </video>
        <div class="tv-wall-container">
            <div class="video-wall" id="videoWall"></div>
        </div>
    </div>

    <script>


        const columns = 4; // 電視牆幾欄
        const rows = 3;    // 電視牆幾列
        const videoList = [
            "", "", "ControlRoom", "Signage",
            "", "", "Dashboard", "MeetingRoom",
            "WorkStation", "Broadcast", "ConferenceSuit", "ServerRoom"
        ];

        const videoWall = document.getElementById("videoWall");
        videoWall.style.aspectRatio = (16 * columns) / (9 * rows)

        videoWall.style.setProperty('--columns', columns);

        videoList.forEach((name, index) => {
            const col = index % columns;
            const row = Math.floor(index / columns);
            const num = (index + 1).toString().padStart(2, '0');

            const screen = document.createElement('div');
            screen.className = `tv-screen`;
            screen.style.width = `${100 / columns}%`
            screen.style.left = `${(100 / columns) * col + 100 / columns / 2}%`;
            screen.style.top = `${(100 / rows) * row + 100 / rows / 2}%`;

            const link = document.createElement('a');
            link.href = "#";
            link.className = `screen-link`;
            link.target = `_blank`;
            link.dataToggle = `modal`;
            link.dataTarget = `#lightBox_webpage_solution-page-${index}`;
            link.rel = `noopener`;


            const text = document.createElement('div');
            text.className = `screen-text`;
            text.innerText = name;



            const video = document.createElement('video');
            video.autoplay = true;
            video.loop = true;
            video.muted = true;

            const source = document.createElement('source');
            source.src = name ? `elements/${name}.mp4` : "elements/";
            source.type = "video/mp4";



            video.appendChild(source);

            screen.appendChild(video);
            screen.appendChild(link);
            screen.appendChild(text);

            ['bottom', 'right', 'top', 'left'].forEach(pos => {
                const border = document.createElement('span');
                border.className = `border-line ${pos}`;
                screen.appendChild(border);
            });

            videoWall.appendChild(screen);
        });




        let openedScreen = null;
        let originalLeft = "";
        let originalTop = "";

        videoWall.addEventListener('click', (e) => {
            const target = e.target.closest('.tv-screen');
            if (!target || openedScreen === target) return;

            // 移除之前的 open 狀態
            if (openedScreen) {
                openedScreen.classList.remove('open');
                openedScreen.style.left = originalLeft;
                openedScreen.style.top = originalTop;

                const closeBtn = document.querySelector('.close-btn');
                if (closeBtn) closeBtn.remove();
            }
            videoWall.classList.remove('open');

            // 記住原本位置並開啟新的 open 狀態
            openedScreen = target;
            originalLeft = openedScreen.style.left;
            originalTop = openedScreen.style.top;

            openedScreen.classList.add('open');
            openedScreen.style.left = '50%';     // ✅ 加上置中
            openedScreen.style.top = '50%';      // ✅ 加上置中
            videoWall.classList.add('open');

            // 新增關閉按鈕
            const btn = document.createElement('button');
            btn.textContent = '✕';
            btn.className = 'close-btn';
            btn.onclick = (e) => {
                e.stopPropagation();
                openedScreen.classList.remove('open');
                openedScreen.style.left = originalLeft; // ✅ 恢復原位置
                openedScreen.style.top = originalTop;
                videoWall.classList.remove('open');
                btn.remove();
                openedScreen = null;
            };
            videoWall.appendChild(btn);
        });














        // 為了確保在行動裝置上順利運行，加載所有影片
        document.addEventListener('DOMContentLoaded', function () {
            const videos = document.querySelectorAll('video');
            videos.forEach(video => {
                // 設定預加載
                video.load();
                // 確保影片循環播放
                video.addEventListener('ended', function () {
                    this.currentTime = 0;
                    this.play();
                });
            });
        });
    </script>
</body>

</html>

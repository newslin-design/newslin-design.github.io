<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かん字れんしゅうシート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/sheet.css">
<link rel="stylesheet" href="css/interactive.css">
</head>
<body data-mode="print">

<div class="toolbar no-print">
  <span class="toolbar__brand"><a href="index.html">かん字れんしゅうシート</a></span>

  <label>
    れんしゅう
    <select id="sheet-picker"></select>
  </label>

  <label>
    モード
    <select id="mode-picker">
      <option value="print">いんさつ（白紙）</option>
      <option value="practice">れんしゅう（自分で書く）</option>
      <option value="answer">こたえ</option>
    </select>
  </label>

  <label>
    描紅
    <select id="guide-level">
      <option value="1">濃い</option>
      <option value="0.45">うすい</option>
      <option value="0">なし</option>
    </select>
  </label>

  <button type="button" id="btn-mark" class="btn-plain trace-only">まるつけ</button>
  <button type="button" id="btn-undo" class="btn-plain trace-only">ひとつ もどす</button>
  <button type="button" id="btn-retry" class="btn-plain trace-only">やりなおす</button>

  <span class="toolbar__spacer"></span>
  <button type="button" id="btn-print" class="btn-print">印刷 / PDF に保存</button>

  <p class="toolbar__hint">
    紅色的範字（和大題 4 左邊的字）點下去會播<b>筆順動畫</b>。
    模式選 <b>れんしゅう</b> 之後：大題 1・4 可以直接在田字格上寫字，大題 2 打假名，大題 3 點格子選字，
    按 <b>まるつけ</b> 批改並算分，80 分以上會蓋「よくできました」。<br>
    列印視窗打開後：紙張選 <b>A4</b>、邊界選 <b>無 (None)</b>、
    勾選 <b>背景圖形 (Background graphics)</b>、取消 <b>頁首及頁尾</b>，再選「另存為 PDF」即可。
  </p>
</div>

<main class="stage"></main>

<script src="data/kanji.js"></script>
<script src="data/strokes.js"></script>
<script src="data/manifest.js"></script>
<script src="js/stroke.js"></script>
<script src="js/order-check.js"></script>
<script src="js/trace.js"></script>
<script src="js/quiz.js"></script>
<script src="js/render.js"></script>
</body>
</html>

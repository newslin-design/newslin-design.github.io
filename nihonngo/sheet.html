<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かん字れんしゅうシート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/sheet.css">
<link rel="stylesheet" href="css/interactive.css">
</head>
<body data-mode="print">

<button type="button" id="nav-toggle" class="sidebar-toggle no-print"
        aria-label="メニュー" aria-expanded="false" aria-controls="sidebar">☰</button>
<div id="nav-scrim" class="sidebar-scrim no-print"></div>

<aside id="sidebar" class="sidebar no-print">
  <div class="sidebar__brand"><a href="index.html">かん字れんしゅうシート</a></div>

  <div class="sidebar__group">
    <label class="field">
      <span>れんしゅう</span>
      <select id="sheet-picker"></select>
    </label>

    <label class="field">
      <span>モード</span>
      <select id="mode-picker">
        <option value="print">いんさつ（白紙）</option>
        <option value="practice">れんしゅう（自分で書く）</option>
        <option value="answer">こたえ</option>
      </select>
    </label>

    <label class="field">
      <span>描紅</span>
      <select id="guide-level">
        <option value="1">濃い</option>
        <option value="0.45">うすい</option>
        <option value="0">なし</option>
      </select>
    </label>
  </div>

  <div class="sidebar__group trace-only">
    <button type="button" id="btn-mark" class="btn-plain">まるつけ</button>
    <button type="button" id="btn-undo" class="btn-plain">ひとつ もどす</button>
    <button type="button" id="btn-retry" class="btn-plain">やりなおす</button>
  </div>

  <div class="sidebar__group">
    <button type="button" id="btn-print" class="btn-print">印刷 / PDF に保存</button>
  </div>

  <details class="sidebar__help">
    <summary>つかいかた</summary>
    <p>紅色的範字（和自由練習左邊的字）點下去會播<b>筆順動畫</b>。</p>
    <p>模式選 <b>れんしゅう</b> 之後：田字格可以直接寫字，讀音題打假名，
       填字題點格子選字，按 <b>まるつけ</b> 批改並算分。</p>
    <p>列印時紙張選 <b>A4</b>、邊界 <b>無</b>、勾選 <b>背景圖形</b>、取消 <b>頁首及頁尾</b>。</p>
  </details>
</aside>

<main class="stage"></main>

<script src="data/kanji.js"></script>
<script src="data/strokes.js"></script>
<script src="data/manifest.js"></script>
<script src="js/stroke.js"></script>
<script src="js/order-check.js"></script>
<script src="js/trace.js"></script>
<script src="js/quiz.js"></script>
<script src="js/render.js"></script>
</body>
</html>

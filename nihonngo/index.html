<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かん字れんしゅうシート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/sheet.css">
<style>
  body { background: var(--page-bg);
         background-image: radial-gradient(var(--page-dot) 1.1px, transparent 1.1px);
         background-size: 17px 17px; }
  .home { max-width: 760px; margin: 0 auto; padding: 48px 24px 80px; }
  .home__banner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 26px; border-radius: 14px; color: #fff;
    background: linear-gradient(135deg, var(--accent-light), var(--accent));
  }
  .home__banner h1 { margin: 0; font-size: 22px; letter-spacing: .04em; }
  .home__banner span { font-size: 13px; opacity: .95; }
  .home h2 { font-size: 15px; color: var(--accent-deep); margin: 34px 0 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
           gap: 14px; padding: 0; margin: 0; list-style: none; }
  .cards > li { display: flex; }
  .card {
    display: flex; flex-direction: column; justify-content: space-between;
    flex: 1; padding: 18px 20px; border: 1px solid var(--panel-border);
    border-radius: 10px; background: #fff; color: inherit; text-decoration: none;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(63,111,196,.18); }
  .card__kanji { font-family: var(--font-write); font-size: 34px; color: var(--accent);
                 letter-spacing: .12em; line-height: 1.2; }
  .card__label { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .note { border: 1px solid var(--info-border); border-radius: 10px; background: #fff;
          padding: 16px 20px; font-size: 13px; line-height: 1.9; color: var(--ink-soft); }
  .note code { background: var(--info-label-bg); border-radius: 4px; padding: 1px 5px;
               font-size: 12px; color: var(--badge-ink); }
</style>
</head>
<body>

<div class="home">
  <div class="home__banner">
    <h1>かん字れんしゅうシート</h1>
    <span>小学1年生 ・ JLPT N3</span>
  </div>

  <h2>れんしゅうシート</h2>
  <ul class="cards" id="cards"></ul>

  <h2>あたらしいシートをつくる</h2>
  <div class="note">
    1. <code>data/kanji.js</code> に かん字を たす（よみかた・かくすう・つかいかた）。<br>
    2. <code>data/sheets/</code> に <code>n3-03.js</code> のような ファイルを つくる。<br>
    3. <code>data/manifest.js</code> に 1ぎょう たす。<br>
    HTML と CSS は さわらなくて いいです。
  </div>
</div>

<script src="data/manifest.js"></script>
<script>
  var list = document.getElementById("cards");
  (window.SHEET_MANIFEST || []).forEach(function (s) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.className = "card";
    a.href = "sheet.html?id=" + encodeURIComponent(s.id);

    var k = document.createElement("div");
    k.className = "card__kanji";
    k.textContent = s.kanji.join("・");
    a.appendChild(k);

    var l = document.createElement("div");
    l.className = "card__label";
    l.textContent = (typeof s.grade === "number" ? s.grade + "年生" : s.grade) + " ／ " + s.label;
    a.appendChild(l);

    li.appendChild(a);
    list.appendChild(li);
  });
</script>
</body>
</html>

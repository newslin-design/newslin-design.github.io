<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1520">
  <title>日本旅行シミュレーター｜便利商店</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
  <div class="app">
    <header class="topbar">
      <h1 class="topbar__title" lang="ja">日本旅行シミュレーター</h1>
      <div class="topbar__tools">
        <div class="seg" id="mode" role="group" aria-label="顯示方式">
          <button type="button" data-mode="all">全部顯示</button>
          <button type="button" data-mode="ja">只看日文</button>
        </div>
        <button type="button" class="icon-btn" id="sound"></button>
      </div>
    </header>

    <main class="view">
      <div class="stage" id="stage">
        <div class="stage__canvas" id="canvas">
          <img class="stage__img" id="stage-img" alt="">
          <div class="stage__labels" id="labels"></div>
          <div class="stage__spots" id="spots"></div>
        </div>
        <div class="stage__overlay" id="overlay"></div>
        <div class="basket" id="basket" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 9h18l-2.2 9.6A2 2 0 0 1 16.9 20H7.1a2 2 0 0 1-1.9-1.4L3 9z" fill="currentColor"/><path d="M8 9l3-5M16 9l-3-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="basket__n">0</span>
        </div>
      </div>
      <section class="panel" id="panel" aria-live="polite"></section>
      <section class="sheet" id="sheet" hidden></section>
    </main>
  </div>

  <noscript><p class="noscript">這個遊戲需要 JavaScript。</p></noscript>

  <!-- 資料（中身） -->
  <script src="data/words.js"></script>
  <script src="data/levels.js"></script>
  <script src="data/scenes/konbini.js"></script>
  <script src="data/scenes/konbini-alts.js"></script>
  <script src="data/picks.js"></script>
  <script src="audio/index.js"></script><!-- 預先生成的音檔對照表（vocab/tools/make-audio.js --app travel 產生） -->
  <!-- 程式（包み） -->
  <script src="js/text.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/steps.js"></script>
  <script src="js/game.js"></script>
  <script src="js/alts.js"></script>
</body>
</html>

	<style>
		.blog-list {
			display: flex;
			flex-direction: column;
			gap: 24px;
		}
		
		/* 簡單的卡片樣式 */
		.blog-card {
			display: flex;
			flex-direction: row;
			background: #fff;
			border-radius: 12px;
			overflow: hidden;
			box-shadow: 0 4px 20px rgba(0,0,0,0.05);
			text-decoration: none;
			color: #333;
			transition: transform 0.3s ease, box-shadow 0.3s ease;
		}
		
		.blog-card:hover {
			transform: translateY(-4px);
			box-shadow: 0 8px 25px rgba(0,0,0,0.1);
		}
		
		.blog-card-img {
			width: 30%;
			min-width: 250px;
			background-size: cover;
			background-position: center;
		}
		
		.blog-card-content {
			padding: 24px 32px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			flex: 1;
		}
		
		.blog-card-date {
			color: #888;
			font-size: 14px;
			margin-bottom: 8px;
		}
		
		.blog-card-title {
			font-size: 24px;
			font-weight: 500;
			margin-bottom: 12px;
		}
		
		.blog-card-excerpt {
			color: #666;
			font-size: 16px;
			line-height: 1.6;
		}
		
		@media (max-width: 768px) {
			.blog-card {
				flex-direction: column;
			}
			.blog-card-img {
				width: 100%;
				height: 200px;
			}
		}
	</style>

				</div>

<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔羅牌占卜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            overflow-x: hidden;
        }

        .screen {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1b4b 0%, #3b0764 50%, #4c0519 100%);
            display: none;
            padding: 2rem;
        }

        .screen.active {
            display: flex;
        }

        /* 開始頁面 */
        #start-screen {
            align-items: center;
            justify-content: center;
        }

        .start-content {
            text-align: center;
        }

        .sparkle-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            font-size: 80px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        h1 {
            font-size: 3rem;
            color: white;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #d8b4fe;
            margin-bottom: 2rem;
        }

        .btn {
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            color: white;
            padding: 1rem 2rem;
            border-radius: 9999px;
            font-size: 1.25rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            background: linear-gradient(135deg, #9333ea 0%, #db2777 100%);
            transform: scale(1.05);
        }

        .btn-start {
            animation: pulse-btn 2s infinite;
        }

        @keyframes pulse-btn {

            0%,
            100% {
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            }

            50% {
                box-shadow: 0 10px 40px rgba(251, 191, 36, 0.4);
            }
        }

        /* 選牌頁面 */
        #selecting-screen {
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h2 {
            font-size: 2rem;
            color: white;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .card-counter {
            color: #d8b4fe;
            margin-bottom: 3rem;
            font-size: 1.1rem;
        }

        .cards-container {
            position: relative;
            margin: 40vh 0 0;
            height: 50px;
            width: 1200px;
            max-width: 95vw;
        }

        .card {
            position: absolute;
            width: 176px;
            height: 320px;
            cursor: pointer;
            transition: all 0.5s ease-out;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
            border-radius: 1rem;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s;
            border: 2px solid rgba(196, 181, 253, 0.3);
            overflow: hidden;
        }

        .card.selected .card-inner {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 25px 70px rgba(251, 191, 36, 0.6);
            transform: translateY(-80px) scale(1.1);
            border: 2px solid rgba(254, 240, 138, 0.4);
        }

        .card:not(.selected):hover .card-inner {
            transform: translateY(-50px);
        }

        .card-back {
            width: 112px;
            height: 220px;
            border: 4px solid #d8b4fe;
            border-radius: 0.75rem;
        }

        .card-symbol {
            width: 100%;
            height: auto;
            display: block;
        }

        .reveal-btn {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            margin-top: 2rem;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        .reveal-btn.show {
            opacity: 1;
        }

        .reveal-btn:hover {
            background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
        }

        /* 結果頁面 */
        #reading-screen {
            flex-direction: column;
        }

        .reading-container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .overall-reading {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2.5rem;
        }

        .overall-title {
            font-size: 1.5rem;
            color: #fcd34d;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .sparkle-small {
            font-size: 1.5rem;
            margin: 0 0.5rem;
        }

        .overall-text {
            color: white;
            font-size: 1.125rem;
            line-height: 1.75;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.3s forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-display {
            width: 100%;
            max-width: 200px;
            height: 320px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border-radius: 1rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            border: 2px solid rgba(254, 240, 138, 0.4);
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .card-display:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px rgba(251, 191, 36, 0.4);
        }

        .card-emoji {
            width: 100%;
            height: auto;
            display: block;
        }

        .card-info {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 1rem;
            padding: 1.5rem;
            width: 100%;
            text-align: center;
        }

        .card-name {
            font-size: 1.5rem;
            color: #fcd34d;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .card-meaning {
            color: #d8b4fe;
            font-size: 1rem;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .card-description {
            color: white;
            line-height: 1.625;
            font-size: 0.95rem;
        }

        .reset-btn {
            display: block;
            margin: 2rem auto 0;
        }

        /* 占卜中頁面 */
        #divining-screen {
            align-items: center;
            justify-content: center;
        }

        .divining-content {
            text-align: center;
        }

        .crystal-ball {
            width: 200px;
            height: 200px;
            margin: 0 auto 2rem;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .crystal-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(167, 139, 250, 0.8), rgba(139, 92, 246, 0.6), rgba(109, 40, 217, 0.9));
            position: relative;
            animation: rotate 4s linear infinite;
            box-shadow:
                0 0 40px rgba(167, 139, 250, 0.6),
                0 0 80px rgba(139, 92, 246, 0.4),
                inset 0 0 60px rgba(255, 255, 255, 0.2);
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .crystal-shine {
            position: absolute;
            top: 20%;
            left: 25%;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8), transparent);
            animation: shimmer 2s ease-in-out infinite;
        }

        @keyframes shimmer {

            0%,
            100% {
                opacity: 0.6;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .crystal-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.3), transparent 70%);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                opacity: 0.5;
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(1.1);
            }
        }

        .divining-text {
            color: white;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            animation: pulse-text 1.5s ease-in-out infinite;
        }

        @keyframes pulse-text {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        .divining-subtext {
            color: #fcd34d;
            font-size: 1.25rem;
        }
    </style>
</head>

<body>
    <!-- 開始頁面 -->
    <div id="start-screen" class="screen active">
        <div class="start-content">
            <div class="sparkle-icon">✨</div>
            <h1>塔羅牌占卜</h1>
            <p class="subtitle">探索你的命運之路</p>
            <button class="btn btn-start" onclick="startReading()">開始占卜</button>
        </div>
    </div>

    <!-- 選牌頁面 -->
    <div id="selecting-screen" class="screen">
        <div style="text-align: center;">
            <div class="cards-container" id="cards-container"></div>

            <h2 style="margin-top: 2rem;">請選擇三張牌</h2>
            <p class="card-counter">已選擇: <span id="selected-count">0</span> / 3</p>

            <div style="display: flex; justify-content: center;">
                <button id="reveal-btn" class="btn reveal-btn" onclick="revealReading()">
                    開始占卜 ✨
                </button>
            </div>
        </div>
    </div>

    <!-- 占卜中頁面 -->
    <div id="divining-screen" class="screen">
        <div class="divining-content">
            <div class="crystal-ball">
                <div class="crystal-inner">
                    <div class="crystal-shine"></div>
                    <div class="crystal-glow"></div>
                </div>
            </div>
            <h2 class="divining-text">正在占卜中...</h2>
            <p class="divining-subtext">✨ 聆聽宇宙的訊息 ✨</p>
        </div>
    </div>

    <!-- 結果頁面 -->
    <div id="reading-screen" class="screen">
        <div class="reading-container">
            <h2 style="text-align: center; margin-bottom: 3rem;">你的塔羅解讀</h2>

            <div id="cards-result" class="cards-grid"></div>

            <div class="overall-reading" style="opacity: 0; animation: fadeInUp 0.8s ease-out 0.6s forwards;">
                <h3 class="overall-title">
                    <span class="sparkle-small">✨</span>
                    根據這三張牌的組合，宇宙傳達給你的訊息是
                    <span class="sparkle-small">✨</span>
                </h3>
                <p class="overall-text">
                    這三張牌組合展現了一個非常積極的訊息。太陽、星星和世界的組合預示著你正處於一個充滿希望和成就的時期。你過去的努力正在開花結果，而未來充滿了光明的可能性。保持信心，相信自己的能力，你將會迎來人生的重要里程碑。這是一個適合慶祝成就、展望未來的時刻。記住，宇宙正在支持你的每一步。
                </p>
            </div>

            <button class="btn reset-btn" onclick="reset()">重新占卜</button>
        </div>
    </div>

    <script>
        // 固定的三張牌結果
        const fixedResult = [
            {
                name: '太陽',
                meaning: '代表成功、喜悅和光明',
                description: '太陽牌象徵著積極的能量和成功。這是一張非常正面的牌，預示著你即將迎來快樂、成就和清晰的時刻。你的努力會得到回報,困難會被克服。',
                image: 'sun.svg'
            },
            {
                name: '星星',
                meaning: '代表希望、靈感和平靜',
                description: '星星牌帶來希望和治癒的訊息。它提醒你要對未來保持信心，相信宇宙的安排。這是一個恢復和重新找到內心平靜的時期。',
                image: 'star.svg'
            },
            {
                name: '世界',
                meaning: '代表完成、成就和圓滿',
                description: '世界牌象徵著一個重要階段的完成和新開始。你已經完成了一個重要的人生課題，現在是時候慶祝你的成就，並準備迎接新的冒險。',
                image: 'world.jpg'
            }
        ];

        const totalCards = 10;
        let selectedCards = [];

        function startReading() {
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('selecting-screen').classList.add('active');
            createCards();
        }

        function createCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            selectedCards = [];

            for (let i = 0; i < totalCards; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = i;

                const totalSpread = 100;
                const rotation = ((i / (totalCards - 1)) - 0.5) * totalSpread;
                const radiusY = 450;
                const angleRad = (rotation * Math.PI) / 180;
                const translateX = Math.sin(angleRad) * radiusY;
                const translateY = Math.cos(angleRad) * radiusY - 280;

                card.style.left = '50%';
                card.style.top = '50%';
                card.style.transformOrigin = 'center center';
                card.style.transform = `translate(calc(-50% + ${translateX}px), calc(-50% - ${translateY}px)) rotate(${rotation}deg)`;
                card.style.zIndex = 50 - Math.abs(i - totalCards / 2);

                card.innerHTML = `
          <div class="card-inner">
            <div class="card-back"></div>
          </div>
        `;

                card.onclick = () => selectCard(i);
                container.appendChild(card);
            }
        }

        function selectCard(index) {
            if (selectedCards.length >= 3 && !selectedCards.includes(index)) {
                return;
            }

            const card = document.querySelector(`.card[data-index="${index}"]`);

            if (selectedCards.includes(index)) {
                selectedCards = selectedCards.filter(i => i !== index);
                card.classList.remove('selected');
                card.querySelector('.card-inner').innerHTML = '<div class="card-back"></div>';
            } else if (selectedCards.length < 3) {
                selectedCards.push(index);
                card.classList.add('selected');
                const resultIndex = selectedCards.length - 1;
                card.querySelector('.card-inner').innerHTML = `
          <img src="${fixedResult[resultIndex].image}" alt="${fixedResult[resultIndex].name}" class="card-symbol">
        `;
                card.style.zIndex = 100;
            }

            document.getElementById('selected-count').textContent = selectedCards.length;

            const revealBtn = document.getElementById('reveal-btn');
            if (selectedCards.length === 3) {
                revealBtn.classList.add('show');
            } else {
                revealBtn.classList.remove('show');
            }
        }

        function revealReading() {
            // 切換到占卜中畫面
            document.getElementById('selecting-screen').classList.remove('active');
            document.getElementById('divining-screen').classList.add('active');

            // 3秒後顯示結果
            setTimeout(() => {
                document.getElementById('divining-screen').classList.remove('active');
                document.getElementById('reading-screen').classList.add('active');
                displayResults();
            }, 3000);
        }

        function displayResults() {
            const container = document.getElementById('cards-result');
            container.innerHTML = '';

            fixedResult.forEach((card, index) => {
                const cardColumn = document.createElement('div');
                cardColumn.className = 'card-column';
                cardColumn.innerHTML = `
          <div class="card-display">
            <img src="${card.image}" alt="${card.name}" class="card-emoji">
          </div>
          <div class="card-info">
            <h3 class="card-name">${card.name}</h3>
            <p class="card-meaning">${card.meaning}</p>
            <p class="card-description">${card.description}</p>
          </div>
        `;
                container.appendChild(cardColumn);
            });
        }

        function reset() {
            selectedCards = [];
            document.getElementById('reading-screen').classList.remove('active');
            document.getElementById('start-screen').classList.add('active');
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>創意電視牆佈局設定器 (含相機背景)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* 左側欄 */
        .sidebar-left {
            width: 280px;
            background: #16213e;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #0f3460;
        }

        .sidebar-left h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #00d4ff;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: #0f3460;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #00d4ff;
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .btn-camera {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-camera:hover {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
        }

        .btn-camera.active {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .screen-list {
            margin-top: 20px;
        }

        .screen-item {
            padding: 12px;
            margin-bottom: 8px;
            background: #0f3460;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .screen-item:hover {
            background: #1e5a8e;
        }

        .screen-item.active {
            background: #00d4ff;
            color: #000;
        }

        .screen-item .delete-btn {
            background: #e74c3c;
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        /* 中間畫布區 */
        .canvas-area {
            flex: 1;
            background: #0f1419;
            position: relative;
            overflow: hidden;
        }

        /* 相機視訊背景 */
        #cameraVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
            pointer-events: none;
        }

        /* 圖片背景 */
        #backgroundImage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
            pointer-events: none;
            display: none;
        }

        .btn-upload {
            background: linear-gradient(135deg, #ffa751 0%, #ffe259 100%);
        }

        .btn-upload:hover {
            background: linear-gradient(135deg, #ffe259 0%, #ffa751 100%);
        }

        .btn-upload.active {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        #imageUpload {
            display: none;
        }

        .camera-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(22, 33, 62, 0.95);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
        }

        .camera-controls h3 {
            font-size: 14px;
            color: #00d4ff;
            margin-bottom: 10px;
        }

        .camera-controls label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            color: #aaa;
        }

        .camera-controls input[type="range"] {
            width: 100%;
            margin-bottom: 10px;
        }

        .camera-controls input[type="number"] {
            width: 70px;
            padding: 4px;
            background: #0f3460;
            border: 1px solid #00d4ff;
            color: #fff;
            border-radius: 4px;
            margin-left: 5px;
        }

        .camera-controls .control-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .camera-controls .control-row label {
            margin: 0;
            margin-right: 10px;
            min-width: 80px;
        }

        .camera-controls button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            background: #0f3460;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .camera-controls button:hover {
            background: #00d4ff;
        }

        .canvas-toolbar {
            position: absolute;
            top: 20px;
            right: 300px;
            background: rgba(22, 33, 62, 0.95);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
        }

        .canvas-toolbar label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #aaa;
        }

        .canvas-toolbar input[type="checkbox"] {
            margin-right: 5px;
        }

        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(22, 33, 62, 0.95);
            padding: 10px;
            border-radius: 8px;
            z-index: 100;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .zoom-btn {
            width: 35px;
            height: 35px;
            background: #0f3460;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
        }

        .zoom-btn:hover {
            background: #00d4ff;
        }

        .zoom-level {
            color: #00d4ff;
            font-size: 14px;
            min-width: 60px;
            text-align: center;
        }

        .canvas-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(22, 33, 62, 0.95);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
            font-size: 12px;
            color: #00d4ff;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            overflow: auto;
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-wrapper {
            display: inline-block;
            transform-origin: center center;
            position: relative;
            z-index: 10;
        }

        .canvas {
            position: relative;
            background: rgba(26, 26, 46, 0.7);
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.3);
        }

        .canvas.grid {
            background-image:
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.15) 0px, rgba(255, 255, 255, 0.15) 1px, transparent 1px, transparent 50px),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.15) 0px, rgba(255, 255, 255, 0.15) 1px, transparent 1px, transparent 50px);
            background-color: rgba(26, 26, 46, 0.5);
        }

        .screen-box {
            position: absolute;
            cursor: move;
        }

        .screen-box-inner {
            width: 100%;
            height: 100%;
            border: 2px solid #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            position: relative;
            transform-origin: left top;
        }

        .screen-box:hover .screen-box-inner {
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .screen-box.selected .screen-box-inner {
            border-color: #ff00ff;
            border-width: 3px;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.6);
        }

        .screen-label {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0, 212, 255, 0.9);
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .resize-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #00d4ff;
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        .resize-handle.nw {
            top: -6px;
            left: -6px;
            cursor: nw-resize;
        }

        .resize-handle.ne {
            top: -6px;
            right: -6px;
            cursor: ne-resize;
        }

        .resize-handle.sw {
            bottom: -6px;
            left: -6px;
            cursor: sw-resize;
        }

        .resize-handle.se {
            bottom: -6px;
            right: -6px;
            cursor: se-resize;
        }

        /* 右側欄 */
        .sidebar-right {
            width: 320px;
            min-width: 40px;
            background: #16213e;
            padding: 20px;
            overflow-y: auto;
            border-left: 1px solid #0f3460;
            transition: width 0.3s ease, padding 0.3s ease;
            position: relative;
            flex-shrink: 0;
        }

        .sidebar-right.collapsed {
            width: 40px;
            padding: 20px 0;
            overflow: hidden;
        }

        .sidebar-right.collapsed > *:not(.sidebar-toggle) {
            opacity: 0;
            pointer-events: none;
        }

        .sidebar-toggle {
            position: absolute;
            top: 10px;
            left: -16px;
            width: 32px;
            height: 32px;
            background: #0f3460;
            border: 1px solid #00d4ff;
            border-radius: 50%;
            color: #00d4ff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .sidebar-toggle:hover {
            background: #1e5a8e;
        }

        .sidebar-right.collapsed .sidebar-toggle {
            transform: rotate(180deg);
        }

        .sidebar-right h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #00d4ff;
        }

        .property-group {
            margin-bottom: 20px;
        }

        .property-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #ddd;
        }

        .property-group input,
        .property-group select {
            width: 100%;
            padding: 8px;
            background: #0f3460;
            border: 1px solid #00d4ff;
            border-radius: 4px;
            color: #fff;
            font-size: 13px;
        }

        .property-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .info-text {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }

        .warning-text {
            font-size: 11px;
            color: #ff9800;
            margin-top: 4px;
        }

        .camera-status {
            padding: 8px;
            background: rgba(255, 152, 0, 0.2);
            border-left: 3px solid #ff9800;
            border-radius: 4px;
            font-size: 11px;
            color: #ffb74d;
            margin-bottom: 10px;
        }

        .camera-status.active {
            background: rgba(76, 175, 80, 0.2);
            border-left-color: #4caf50;
            color: #81c784;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 左側欄:操作與螢幕列表 -->
        <div class="sidebar-left">
            <h2>📐 畫布設定</h2>
            <label style="font-size: 12px; color: #aaa;">畫布寬度 (px)</label>
            <input type="number" id="canvasWidth" value="1920" min="100"
                style="width: 100%; padding: 8px; margin-bottom: 10px; background: #0f3460; border: 1px solid #00d4ff; border-radius: 4px; color: #fff;">

            <label style="font-size: 12px; color: #aaa;">畫布高度 (px)</label>
            <input type="number" id="canvasHeight" value="1080" min="100"
                style="width: 100%; padding: 8px; margin-bottom: 10px; background: #0f3460; border: 1px solid #00d4ff; border-radius: 4px; color: #fff;">

            <button class="btn btn-primary" onclick="updateCanvasSize()">✓ 套用畫布大小</button>

            <h2 style="margin-top: 30px;">🖼️ 背景設定</h2>
            <button class="btn btn-camera" id="cameraToggle" onclick="toggleCamera()">🎥 啟動相機背景</button>
            <button class="btn btn-upload" id="uploadToggle" onclick="triggerImageUpload()">📁 上傳圖片背景</button>
            <input type="file" id="imageUpload" accept="image/*" onchange="handleImageUpload(event)">
            <div id="backgroundStatus" class="camera-status">背景未設定</div>

            <h2 style="margin-top: 30px;">➕ 新增螢幕</h2>
            <button class="btn" onclick="addScreen()">+ 新增輸出螢幕</button>

            <h2 style="margin-top: 30px;">📺 螢幕列表</h2>
            <div id="screenList" class="screen-list"></div>
        </div>

        <!-- 中間:畫布區域 -->
        <div class="canvas-area">
            <!-- 相機視訊背景 -->
            <video id="cameraVideo" autoplay playsinline></video>

            <!-- 圖片背景 -->
            <img id="backgroundImage" alt="背景圖片">

            <!-- 背景控制面板 -->
            <div class="camera-controls" id="cameraControls" style="display: none;">
                <h3>📹 背景影像調整</h3>

                <div class="control-row">
                    <label>縮放:</label>
                    <input type="range" id="cameraZoom" min="50" max="200" value="100" oninput="updateCameraTransform()"
                        style="flex: 1;">
                    <input type="number" id="cameraZoomValue" value="100" min="50" max="200"
                        oninput="document.getElementById('cameraZoom').value=this.value; updateCameraTransform();">
                    <span style="font-size: 11px; color: #888;">%</span>
                </div>

                <div class="control-row">
                    <label>X 位移:</label>
                    <input type="range" id="cameraPanX" min="-500" max="500" value="0" oninput="updateCameraTransform()"
                        style="flex: 1;">
                    <input type="number" id="cameraPanXValue" value="0" min="-500" max="500"
                        oninput="document.getElementById('cameraPanX').value=this.value; updateCameraTransform();">
                    <span style="font-size: 11px; color: #888;">px</span>
                </div>

                <div class="control-row">
                    <label>Y 位移:</label>
                    <input type="range" id="cameraPanY" min="-500" max="500" value="0" oninput="updateCameraTransform()"
                        style="flex: 1;">
                    <input type="number" id="cameraPanYValue" value="0" min="-500" max="500"
                        oninput="document.getElementById('cameraPanY').value=this.value; updateCameraTransform();">
                    <span style="font-size: 11px; color: #888;">px</span>
                </div>

                <div class="control-row">
                    <label>透明度:</label>
                    <input type="range" id="cameraOpacity" min="10" max="100" value="80"
                        oninput="updateCameraTransform()" style="flex: 1;">
                    <input type="number" id="cameraOpacityValue" value="80" min="10" max="100"
                        oninput="document.getElementById('cameraOpacity').value=this.value; updateCameraTransform();">
                    <span style="font-size: 11px; color: #888;">%</span>
                </div>

                <button onclick="resetCameraTransform()">🔄 重置影像</button>
            </div>

            <div class="canvas-toolbar">
                <label><input type="checkbox" id="showGrid" checked onchange="toggleGrid()"> 顯示網格</label>
                <label><input type="checkbox" id="snapToGrid" onchange="toggleSnap()"> 對齊網格</label>
            </div>

            <div class="canvas-info" id="canvasInfo">
                畫布: 1920 × 1080 px
            </div>

            <div class="zoom-controls">
                <button class="zoom-btn" onclick="zoomOut()">−</button>
                <span class="zoom-level" id="zoomLevel">100%</span>
                <button class="zoom-btn" onclick="zoomIn()">+</button>
                <button class="zoom-btn" onclick="resetZoom()" title="重置縮放">⟲</button>
            </div>

            <div class="canvas-container" id="canvasContainer">
                <div class="canvas-wrapper" id="canvasWrapper">
                    <div class="canvas grid" id="canvas"></div>
                </div>
            </div>
        </div>

        <!-- 右側欄:屬性編輯與 JSON -->
        <div class="sidebar-right" id="sidebarRight">
            <button class="sidebar-toggle" onclick="toggleSidebar()" title="收合/展開側邊欄">◀</button>
            <h2>⚙️ 螢幕屬性</h2>
            <div id="propertiesPanel">
                <p style="color: #888; text-align: center; padding: 40px 20px;">請選擇一個螢幕以編輯其屬性</p>
            </div>

            <h2 style="margin-top: 30px;">切換</h2>
            <button class="btn btn-primary" onclick="uploadPattern()">⬆️ 上傳自定創意拚接模板</button>
            <button class="btn btn-primary" onclick="switchVideo()">▶️ 切換影像至TX-0001(自定)</button>
            <button class="btn btn-primary" onclick="switchVideo0()">▶️ 切換影像至TX-0001(風車)</button>
            <button class="btn btn-primary" onclick="resetLobby()">🔄 斷線並重置Lobby</button>

            <h2 style="margin-top: 30px;">📄 JSON 輸出</h2>
            <button class="btn btn-primary" onclick="generateJSON()">📋 生成配置 JSON</button>
            <button class="btn" onclick="copyJSON()" id="copyBtn" style="display: none;">📑 複製 JSON</button>
            <div id="jsonOutput"
                style="margin-top: 10px; padding: 15px; background: #0f3460; border-radius: 6px; max-height: 400px; overflow-y: auto; display: none;">
                <pre id="jsonContent"
                    style="color: #00d4ff; font-size: 11px; margin: 0; white-space: pre-wrap; word-wrap: break-word;"></pre>
            </div>
        </div>
    </div>

    <script>
        // 側邊欄收合/展開
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebarRight');
            sidebar.classList.toggle('collapsed');
        }

        // 全域狀態
        let screens = [];
        let selectedScreen = null;
        let dragState = null;
        let resizeState = null;
        let screenIdCounter = 1;
        let zoomLevel = 1;
        let showGrid = true;
        let snapToGrid = false;
        let generatedJSON = null;
        let cameraStream = null;
        let cameraActive = false;
        let backgroundType = null; // 'camera' 或 'image'
        let uploadedImage = null;

        const canvas = {
            width: 1920,
            height: 1080
        };

        // 初始化
        function init() {
            updateCanvasSize();
            updateScreenList();
            updatePropertiesPanel();

            // 同步滑桿和數字輸入框
            syncCameraControls();
        }

        // 背景功能
        async function toggleCamera() {
            const video = document.getElementById('cameraVideo');
            const imageEl = document.getElementById('backgroundImage');
            const cameraBtn = document.getElementById('cameraToggle');
            const uploadBtn = document.getElementById('uploadToggle');
            const status = document.getElementById('backgroundStatus');
            const controls = document.getElementById('cameraControls');

            if (!cameraActive) {
                // 關閉圖片背景
                if (backgroundType === 'image') {
                    closeImageBackground();
                }

                try {
                    // 請求相機權限
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        }
                    });

                    video.srcObject = cameraStream;
                    cameraActive = true;
                    backgroundType = 'camera';

                    cameraBtn.textContent = '⏸️ 停止相機';
                    cameraBtn.classList.add('active');
                    uploadBtn.classList.remove('active');
                    status.textContent = '✓ 相機已啟動';
                    status.classList.add('active');
                    controls.style.display = 'block';

                } catch (error) {
                    console.error('無法存取相機:', error);
                    alert('無法存取相機,請確認:\n1. 瀏覽器已允許相機權限\n2. 相機未被其他程式使用\n3. 使用 HTTPS 或 localhost');
                    status.textContent = '❌ 相機啟動失敗';
                }
            } else {
                // 停止相機
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                    cameraStream = null;
                }

                video.srcObject = null;
                cameraActive = false;
                backgroundType = null;

                cameraBtn.textContent = '🎥 啟動相機背景';
                cameraBtn.classList.remove('active');
                status.textContent = '背景未設定';
                status.classList.remove('active');
                controls.style.display = 'none';
            }
        }

        function triggerImageUpload() {
            // 如果已經有圖片,則移除
            if (backgroundType === 'image') {
                closeImageBackground();
                return;
            }

            // 關閉相機背景
            if (cameraActive) {
                toggleCamera();
            }

            document.getElementById('imageUpload').click();
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const imageEl = document.getElementById('backgroundImage');
                const video = document.getElementById('cameraVideo');
                const uploadBtn = document.getElementById('uploadToggle');
                const status = document.getElementById('backgroundStatus');
                const controls = document.getElementById('cameraControls');

                // 設定圖片
                uploadedImage = e.target.result;
                imageEl.src = uploadedImage;
                imageEl.style.display = 'block';
                video.style.display = 'none';

                backgroundType = 'image';

                uploadBtn.textContent = '🗑️ 移除圖片';
                uploadBtn.classList.add('active');
                status.textContent = '✓ 圖片已載入';
                status.classList.add('active');
                controls.style.display = 'block';

                // 重置變換
                resetCameraTransform();
            };
            reader.readAsDataURL(file);
        }

        function closeImageBackground() {
            const imageEl = document.getElementById('backgroundImage');
            const video = document.getElementById('cameraVideo');
            const uploadBtn = document.getElementById('uploadToggle');
            const status = document.getElementById('backgroundStatus');
            const controls = document.getElementById('cameraControls');

            imageEl.style.display = 'none';
            imageEl.src = '';
            video.style.display = 'block';
            uploadedImage = null;
            backgroundType = null;

            uploadBtn.textContent = '📁 上傳圖片背景';
            uploadBtn.classList.remove('active');
            status.textContent = '背景未設定';
            status.classList.remove('active');
            controls.style.display = 'none';

            // 重置檔案輸入
            document.getElementById('imageUpload').value = '';
        }

        function updateCameraTransform() {
            const video = document.getElementById('cameraVideo');
            const imageEl = document.getElementById('backgroundImage');
            const zoom = document.getElementById('cameraZoom').value;
            const panX = document.getElementById('cameraPanX').value;
            const panY = document.getElementById('cameraPanY').value;
            const opacity = document.getElementById('cameraOpacity').value;

            // 同步數值顯示
            document.getElementById('cameraZoomValue').value = zoom;
            document.getElementById('cameraPanXValue').value = panX;
            document.getElementById('cameraPanYValue').value = panY;
            document.getElementById('cameraOpacityValue').value = opacity;

            // 套用變換到當前背景
            const transform = `scale(${zoom / 100}) translate(${panX}px, ${panY}px)`;
            const opacityValue = opacity / 100;

            if (backgroundType === 'camera') {
                video.style.transform = transform;
                video.style.opacity = opacityValue;
            } else if (backgroundType === 'image') {
                imageEl.style.transform = transform;
                imageEl.style.opacity = opacityValue;
            }
        }

        // 渲染螢幕
        function renderScreens() {
            const canvasEl = document.getElementById('canvas');
            canvasEl.innerHTML = '';

            screens.forEach(screen => {
                const box = document.createElement('div');
                box.className = 'screen-box';

                box.style.height = screen.cropH + 'px';

                const inner = document.createElement('div');

                // 支援任意角度旋轉
                const rotationRad = (screen.rotation * Math.PI) / 180;
                const cos = Math.cos(rotationRad);
                const sin = Math.sin(rotationRad);

                // 使用 CSS transform rotate
                inner.style.transform = `rotate(${screen.rotation}deg)`;

                const label = document.createElement('div');
                label.className = 'screen-label';
                label.textContent = screen.label;

                inner.appendChild(label);

                // 新增調整大小的控制點
                ['nw', 'ne', 'sw', 'se'].forEach(dir => {
                    const handle = document.createElement('div');
                    handle.className = `resize-handle ${dir}`;
                    handle.onmousedown = (e) => {
                        e.stopPropagation();
                        startResize(e, screen, dir);
                    };
                    inner.appendChild(handle);
                });

                box.appendChild(inner);
                box.onmousedown = (e) => {
                    if (e.target === box || e.target === inner || e.target === label) {
                        startDrag(e, screen);
                    }
                };

                canvasEl.appendChild(box);
            });
        }

        // 拖曳功能
        function startDrag(e, screen) {
            e.preventDefault();
            selectScreen(screen.id);

            dragState = {
                screen: screen,
                startX: e.clientX,
                startY: e.clientY,
                initialX: screen.cropX,
                initialY: screen.cropY
            };

            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
        }

        function onDrag(e) {
            if (!dragState) return;

            const dx = (e.clientX - dragState.startX) / zoomLevel;
            const dy = (e.clientY - dragState.startY) / zoomLevel;

            let newX = dragState.initialX + dx;
            let newY = dragState.initialY + dy;

            if (newX < 0)
                newX = 0;

            if (dragState.screen.rotation === 0 || dragState.screen.rotation === 180) {
                if (newX + dragState.screen.cropW > canvas.width)
                    newX = canvas.width - dragState.screen.cropW;
            } else {
                if (newX + dragState.screen.cropH > canvas.width)
                    newX = canvas.width - dragState.screen.cropH;
            }

            if (newY < 0)
                newY = 0;

            if (dragState.screen.rotation === 0 || dragState.screen.rotation === 180) {
                if (newY + dragState.screen.cropH > canvas.height)
                    newY = canvas.height - dragState.screen.cropH;
            } else {
                if (newY + dragState.screen.cropW > canvas.height)
                    newY = canvas.height - dragState.screen.cropW;
            }

            if (snapToGrid) {
                newX = Math.round(newX / 50) * 50;
                newY = Math.round(newY / 50) * 50;
            }

            dragState.screen.cropX = Math.round(newX);
            dragState.screen.cropY = Math.round(newY);

            renderScreens();
            updatePropertiesPanel();
        }

        function stopDrag() {
            dragState = null;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
        }

        // 調整大小功能
        function getAspectRatio(ratioStr) {
            if (ratioStr.includes(':')) {
                const parts = ratioStr.split(':');
                return parseFloat(parts[0]) / parseFloat(parts[1]);
            }
            return 16 / 9;
        }

        function startResize(e, screen, dir) {
            e.preventDefault();
            selectScreen(screen.id);

            resizeState = {
                screen: screen,
                dir: dir,
                startX: e.clientX,
                startY: e.clientY,
                initialW: screen.cropW,
                initialH: screen.cropH,
                initialX: screen.cropX,
                initialY: screen.cropY
            };

            document.addEventListener('mousemove', onResize);
            document.addEventListener('mouseup', stopResize);
        }

        function onResize(e) {
            if (!resizeState) return;

            const dx = (e.clientX - resizeState.startX) / zoomLevel;
            const dy = (e.clientY - resizeState.startY) / zoomLevel;

            const screen = resizeState.screen;
            const aspectRatio = getAspectRatio(screen.aspectRatio);

            let newW = resizeState.initialW;
            let newH = resizeState.initialH;
            let newX = resizeState.initialX;
            let newY = resizeState.initialY;

            // 根據拖曳方向調整尺寸,保持長寬比
            if (resizeState.dir === 'se') {
                newW = Math.max(50, resizeState.initialW + dx);
                newH = newW / aspectRatio;
            } else if (resizeState.dir === 'sw') {
                newW = Math.max(50, resizeState.initialW - dx);
                newH = newW / aspectRatio;
                newX = resizeState.initialX + (resizeState.initialW - newW);
            } else if (resizeState.dir === 'ne') {
                newW = Math.max(50, resizeState.initialW + dx);
                newH = newW / aspectRatio;
                newY = resizeState.initialY + (resizeState.initialH - newH);
            } else if (resizeState.dir === 'nw') {
                newW = Math.max(50, resizeState.initialW - dx);
                newH = newW / aspectRatio;
                newX = resizeState.initialX + (resizeState.initialW - newW);
                newY = resizeState.initialY + (resizeState.initialH - newH);
            }

            screen.cropW = Math.round(newW);
            screen.cropH = Math.round(newH);
            screen.cropX = Math.round(newX);
            screen.cropY = Math.round(newY);

            renderScreens();
            updatePropertiesPanel();
        }

        function stopResize() {
            resizeState = null;
            document.removeEventListener('mousemove', onResize);
            document.removeEventListener('mouseup', stopResize);
        }

        function updateProperty(prop, value) {
            if (!selectedScreen) return;

        function updateAspectRatio(ratio) {
            if (!selectedScreen) return;

            screen.aspectRatio = ratio;

                // 根據新的長寬比調整高度,保持寬度不變
                const aspectValue = getAspectRatio(ratio);

            renderScreens();
            updatePropertiesPanel();

            g_xhr_error_cb = error_cb;
            g_xhr_timeout_cb = timeout_cb;
            g_xhr_state_cb = state_cb;

            g_xhr.open("GET", url);

                        height: s.cropH,
                        rotate: s.rotation
                    };

                    if (s.rotation == 90 || s.rotation == 270) {
                        tmp.width = s.cropH;
                        tmp.height = s.cropW;
                    }

                    return tmp;
                })
            };

            (async () => {
                try {
                    await login();

                    const patterns = await getPatterns();

                    if (patterns.length > 32) {
                        output.id = patterns[32].id;

                        await patternOp(output, 'PATCH');
                    } else {
                        await patternOp(output, 'POST');
                    }
                } catch (err) {
                    console.log(err.message);
                }
            })();
        }

        // 切換影像
        function switchVideo() {
            (async () => {
                try {
                    await login();

                    let videoExts = await getVideoExts();

                    videoExts.sort((a, b) => a.idx - b.idx);

                    let profile = {
                        id: "000000000001",
                        rx: [
                        ],
                        tx: [
                        ],
                        walls: [
                            {
                                bezelWidth: {
                                    bottom: 0,
                                    left: 0,
                                    right: 0,
                                    top: 0
                                },
                                fitMode: {
                                    value: 3
                                },
                                id: "0001",
                                layoutIdx: 32,
                                layouts: [
                                ],
                                name: "creative",
                                rx: [
                                ],
                                type: 1
                            }
                        ]
                    };
                    let tx_devid;
                    let rx_count = 0;

                    videoExts.forEach(videoExt => {
                        if (videoExt.type == "tx") {
                            profile.tx.push(videoExt.id);
                            if (tx_devid == null)
                                tx_devid = videoExt.id;
                        } else {
                            profile.rx.push(videoExt.id);
                            profile.walls[0].rx.push(videoExt.id);
                            rx_count++;
                        }
                    });

                    const patterns = await getPatterns();

                    if (patterns.length <= 32)
                        return;

                    if (rx_count < patterns[32].slices.length)
                        profile.walls[0].rx.push(...Array(patterns[32].slices.length - rx_count).fill(""));

                    await profileOp(profile);

                    const sw = {
                        type: 1,
                        room: "000000000001",
                        wall: "0001",
                        tx: tx_devid
                    };

                    await switchOp(sw);
                } catch (err) {
                    console.log(err.message);
                }
            })();
        }

                try {

                    const sw = {

                    };

        // 生成配置 JSON
        function generateJSON() {
            const output = {
                canvas: {
                    width: canvas.width,
                    height: canvas.height
                },
                screens: screens.map(s => ({
                    id: s.id,
                    label: s.label,
                    outputId: s.outputId,
                    position: {
                        x: s.cropX,
                        y: s.cropY
                    },
                    size: {
                        width: s.cropW,
                        height: s.cropH
                    },
                    rotation: s.rotation,
                    aspectRatio: s.aspectRatio
                })),
                pattern: {
                    width: canvas.width,
                    height: canvas.height,
                    slices: screens.map(s => {
                        let tmp = {
                            left: s.cropX,
                            top: s.cropY,
                            width: s.cropW,
                            height: s.cropH,
                            rotate: s.rotation
                        };

                        // 如果是 90 或 270 度,交換寬高
                        if (s.rotation == 90 || s.rotation == 270) {
                            tmp.width = s.cropH;
                            tmp.height = s.cropW;
                        }

                        return tmp;
                    })
                }
            };

            generatedJSON = JSON.stringify(output, null, 2);

            document.getElementById('jsonContent').textContent = generatedJSON;
            document.getElementById('jsonOutput').style.display = 'block';
            document.getElementById('copyBtn').style.display = 'block';
        }

        // 複製 JSON 到剪貼簿
        function copyJSON() {
            if (!generatedJSON) {
                alert('請先生成 JSON');
                return;
            }

            navigator.clipboard.writeText(generatedJSON).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.textContent;
                btn.textContent = '✓ 已複製!';
                btn.style.background = 'linear-gradient(135deg, #4caf50 0%, #66bb6a 100%)';

                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                }, 2000);
            }).catch(err => {
                alert('複製失敗: ' + err);
            });
        }

        // 啟動
        init();
    </script>

<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATEN Essentials | High Performance Connectivity</title>
    <meta name="description" content="ATEN Essentials - Professional connectivity solutions. Explore our full lineup.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <style>
        /* =========================================
           1. Design System & Variables
           ========================================= */
        :root {
            /* Palette */
            --primary-color: #FF6600;
            /* ATEN Orange */
            --primary-hover: #E65C00;
            --bg-dark: #121212;
            /* Deep Dark Background */
            --bg-light-dark: #1a1a1a;
            --text-main: #FFFFFF;
            --text-muted: #CCCCCC;
            --text-light-gray: #AAAAAA;
            --card-bg: #222222;
            --border-color: rgba(255, 255, 255, 0.1);

            /* Typography */
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Roboto', sans-serif;

            /* Spacing & Layout */
            --header-height: 80px;
            --container-width: 1200px;
            --section-padding: 80px 0;

            /* Z-Index Layers */
            --z-video: -1;
            --z-overlay: 0;
            --z-content: 10;
            --z-header: 100;
            --z-fab: 200;

            /* Parallax specific */
            --sun-size-desktop: 1800px;
            --sun-size-mobile: 900px;
        }

        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
        }

        ul {
            list-style: none;
        }

        /* Utility: Container */
        .container {
            width: 100%;
            max-width: var(--container-width);
            margin: 0 auto;
            padding: 0 20px;
        }

        /* =========================================
           2. UI Components (Buttons)
           ========================================= */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            font-family: var(--font-heading);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            border-radius: 4px;
        }

        /* Solid Primary Button */
        .btn-primary {
            background-color: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.4);
        }

        /* Outline Button */
        .btn-outline {
            background-color: transparent;
            color: var(--primary-color);
            border-color: var(--primary-color);
            padding: 8px 20px;
            /* Slightly smaller for header */
        }

        .btn-outline:hover {
            background-color: var(--primary-color);
            color: #fff;
        }

        /* Category Filter Buttons */
        .category-filter-btn {
            padding: 10px 25px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-family: var(--font-body);
            font-weight: 500;
            border-radius: 20px;
            margin: 0 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            /* Prevent wrapping */
        }

        .category-filter-btn.active,
        .category-filter-btn:hover {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
        }

        /* Product Thumbnail Buttons */
        .product-thumb-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            display: block;
            width: 100%;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .product-thumb-btn:hover {
            transform: translateY(-5px);
        }

        .product-thumb-btn.active .product-thumb-image-wrapper {
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.8), 0 0 30px rgba(255, 102, 0, 0.6);
            border-color: var(--primary-color);
        }

        .product-thumb-image-wrapper {
            position: relative;
            width: 100%;
            /* Make wrapper responsive */
            padding-bottom: 75%;
            /* Aspect ratio 4:3, adjust if needed */
            background-color: var(--bg-light-dark);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid transparent;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .product-thumb-image-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(255, 102, 0, 0.4) 0%, rgba(255, 102, 0, 0) 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .product-thumb-btn.active .product-thumb-image-wrapper::before,
        .product-thumb-btn:hover .product-thumb-image-wrapper::before {
            opacity: 1;
        }

        .product-thumb-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 80%;
            /* Adjust size of the product image inside thumb */
            max-height: 80%;
            object-fit: contain;
        }

        .product-thumb-name {
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.9rem;
            margin-top: 10px;
            white-space: normal;
            /* Allow product name to wrap */
            word-break: break-word;
        }

        /* =========================================
           3. Header
           ========================================= */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(10px);
            z-index: var(--z-header);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-img {
            height: 36px;
            width: auto;
            display: block;
        }

        /* =========================================
           4. Session 1: Hero Section
           ========================================= */
        .hero-section {
            position: relative;
            height: 100vh;
            min-height: 600px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Video Background */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: var(--z-video);
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Overlay: Darkening + Bottom Fade Out */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: var(--z-overlay);
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.3)),
                linear-gradient(to bottom, transparent 85%, var(--bg-dark) 100%);
        }

        /* Hero Content */
        .hero-content {
            position: relative;
            z-index: var(--z-content);
            text-align: center;
            padding-top: var(--header-height);
        }

        .hero-title {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            /* Mobile default */
            font-weight: 700;
            margin-bottom: 1rem;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(30px);
            line-height: 1.1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .hero-title .highlight {
            color: var(--primary-color);
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            opacity: 0;
            transform: translateY(30px);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-cta {
            opacity: 0;
            transform: translateY(30px);
        }

        /* =========================================
           5. Section 2: Glow Hero (Parallax)
           ========================================= */
        .glow-hero-section {
            position: relative;
            height: 150vh;
            /* Make it taller for parallax scroll */
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            /* Start from top */
            color: var(--text-main);
            overflow: hidden;
            padding-top: var(--header-height);
        }

        .sun-parallax-bg {
            position: absolute;
            bottom: -50%;
            /* Start off-screen */
            left: 50%;
            transform: translateX(-50%) scale(1);
            width: var(--sun-size-mobile);
            /* Smaller for mobile */
            height: var(--sun-size-mobile);
            background: radial-gradient(circle at center,
                    rgba(255, 102, 0, 0.7) 0%,
                    rgba(255, 102, 0, 0.4) 30%,
                    rgba(255, 102, 0, 0) 70%);
            border-radius: 50%;
            opacity: 0;
            /* Initial hidden */
            transition: opacity 0.5s ease-out;
            will-change: transform, opacity;
            /* Optimize for animation */
        }

        .glow-text-wrapper {
            position: sticky;
            /* Keep text centered while sun rises */
            top: 50%;
            transform: translateY(-50%);
            z-index: var(--z-content);
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease-out;
            padding: 0 20px;
            max-width: 900px;
        }

        .glow-text-wrapper.show-content {
            opacity: 1;
        }

        .glow-text-wrapper.hide-content {
            opacity: 0;
        }

        .glow-title {
            font-family: var(--font-heading);
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .glow-subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        /* =========================================
           6. Section 3: Product Showcase
           ========================================= */
        .product-showcase-section {
            background-color: var(--bg-dark);
            padding: var(--section-padding);
            text-align: center;
            opacity: 0;
            /* Initial hidden */
            transform: translateY(50px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }

        .product-showcase-section.is-visible {
            opacity: 1;
            transform: translateY(0);
        }


        .section-title {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 2.5rem;
            color: var(--text-main);
        }

        /* Category Filter */
        .category-filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 3rem;
            gap: 10px;
            /* Space between buttons */
            overflow-x: auto;
            /* Enable horizontal scroll on small screens */
            padding-bottom: 10px;
            /* Space for scrollbar */
            -webkit-overflow-scrolling: touch;
            /* Smooth scrolling on iOS */
            scrollbar-width: none;
            /* Hide scrollbar for Firefox */
        }

        /* Hide scrollbar for Chrome, Safari, Opera */
        .category-filters::-webkit-scrollbar {
            display: none;
        }


        /* Main Product Display */
        .main-product-display {
            display: flex;
            flex-direction: column;
            /* Mobile default */
            align-items: center;
            gap: 40px;
            background-color: var(--bg-light-dark);
            border-radius: 10px;
            padding: 40px 20px;
            margin-bottom: 40px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .main-product-image-wrapper {
            position: relative;
            width: 80%;
            max-width: 400px;
            margin-bottom: 30px;
            background: radial-gradient(circle at center, rgba(255, 102, 0, 0.4) 0%, rgba(255, 102, 0, 0) 70%);
            border-radius: 50%;
            /* Circular glow effect */
            padding-bottom: 80%;
            /* Maintain aspect ratio for the glow */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-product-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        .main-product-details {
            text-align: center;
            width: 100%;
        }

        .main-product-name {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .main-product-description {
            font-size: 1rem;
            color: var(--text-light-gray);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .product-features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            margin-top: 25px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .feature-item svg {
            width: 40px;
            height: 40px;
            fill: var(--text-light-gray);
            /* Default icon color */
            margin-bottom: 10px;
        }

        .feature-item.icon-8k svg {
            fill: #fff;
        }

        /* Special 8K icon color */


        /* Product Thumbnails Grid */
        .product-thumbnails-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            /* Mobile default */
            gap: 25px;
        }


        /* =========================================
           7. Animations (Scroll Trigger)
           ========================================= */
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .animate-on-scroll.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .delay-100.is-visible {
            transition-delay: 0.1s;
        }

        .delay-200.is-visible {
            transition-delay: 0.2s;
        }

        .delay-300.is-visible {
            transition-delay: 0.3s;
        }

        .delay-400.is-visible {
            transition-delay: 0.4s;
        }


        /* =========================================
           8. Floating Action Button (FAB)
           ========================================= */
        .fab-wrapper {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: var(--z-fab);
        }

        .fab-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: var(--primary-color);
            border: none;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, background-color 0.3s;
            animation: pulse 2s infinite;
        }

        .fab-btn:hover {
            background-color: var(--primary-hover);
            transform: scale(1.1);
        }

        .fab-btn svg {
            width: 30px;
            height: 30px;
            margin-left: 4px;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 102, 0, 0.6);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(255, 102, 0, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 102, 0, 0);
            }
        }

        /* =========================================
           9. RWD Media Queries
           ========================================= */
        /* Tablet & Desktop */
        @media (min-width: 768px) {
            .hero-title {
                font-size: 4.5rem;
            }

            .hero-subtitle {
                font-size: 1.4rem;
            }

            .glow-title {
                font-size: 4rem;
            }

            .glow-subtitle {
                font-size: 1.5rem;
            }

            .sun-parallax-bg {
                width: var(--sun-size-desktop);
                height: var(--sun-size-desktop);
            }

            .section-title {
                font-size: 3rem;
            }

            .main-product-display {
                flex-direction: row;
                /* Desktop layout */
                text-align: left;
                padding: 60px;
            }

            .main-product-image-wrapper {
                width: 50%;
                /* Take half width */
                max-width: 500px;
                /* Limit max size */
                margin-bottom: 0;
            }

            .main-product-details {
                width: 50%;
                /* Take other half */
                padding-left: 40px;
            }

            .main-product-name {
                font-size: 2.5rem;
            }

            .main-product-description {
                font-size: 1.1rem;
            }

            .product-features {
                grid-template-columns: repeat(2, 1fr);
                /* 2 columns for features */
                margin-left: 0;
                margin-right: 0;
            }

            .product-thumbnails-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
        }

        @media (min-width: 1024px) {
            .hero-title {
                font-size: 5.5rem;
            }

            .glow-title {
                font-size: 5rem;
            }

            .product-thumbnails-grid {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            }
        }
    </style>
</head>

        // 1. Scroll Animations (Intersection Observer)
        function initScrollAnimations() {
            const animatedElements = document.querySelectorAll('.animate-on-scroll');
            const productSection = document.getElementById('product-showcase');

            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.15
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        // Don't unobserve if we want to re-trigger (optional), 
                        // here we stop observing for one-time animation
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            animatedElements.forEach(el => observer.observe(el));

            // Observer for Product Section to trigger its fade in
            const sectionObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                    }
                });
            }, { threshold: 0.1 });

            if (productSection) sectionObserver.observe(productSection);
        }

        // 2. FAB Interaction
        function initFABInteraction() {
            const fabBtn = document.getElementById('fab-video-btn');
            if (fabBtn) {
                fabBtn.addEventListener('click', () => {
                    alert("模擬動作：開啟品牌形象影片 (Lightbox/Modal)");
                    console.log("Video modal triggered");
                });
            }
        }

        // 3. Parallax Effect (Sun Rising)
        function initParallaxEffect() {
            const glowSection = document.getElementById('glow-hero');
            const sunBg = document.getElementById('sun-parallax-bg');
            const glowText = document.getElementById('glow-text-wrapper');

            if (!glowSection || !sunBg || !glowText) return;

            window.addEventListener('scroll', () => {
                const rect = glowSection.getBoundingClientRect();
                const windowHeight = window.innerHeight;

                // Calculate scroll progress within the section
                // Start effect when section top enters viewport
                let progress = 0;
                const startOffset = windowHeight * 0.8; // Adjust when to start

                if (rect.top < startOffset && rect.bottom > 0) {
                    const totalDistance = rect.height + startOffset;
                    const currentDistance = startOffset - rect.top;
                    progress = Math.min(Math.max(currentDistance / totalDistance, 0), 1);
                }

                // --- Animation Logic ---

                // 1. Sun Movement: Rise up
                // Initial bottom: -50%, Target: -10% or 0%
                const startBottom = -50;
                const endBottom = -10;
                const currentBottom = startBottom + (endBottom - startBottom) * (progress * 1.5); // Accelerate a bit

                // 2. Sun Opacity & Scale
                let sunOpacity = progress * 2;
                if (sunOpacity > 1) sunOpacity = 1;

                const scale = 1 + progress * 0.2;

                sunBg.style.bottom = `${currentBottom}%`;
                sunBg.style.opacity = sunOpacity;
                sunBg.style.transform = `translateX(-50%) scale(${scale})`;

                // 3. Text Opacity: Fade In then Fade Out
                // Fade In: 0.1 - 0.4
                // Visible: 0.4 - 0.6
                // Fade Out: 0.6 - 0.9

                if (progress < 0.1) {
                    glowText.classList.remove('show-content');
                    glowText.style.opacity = 0;
                } else if (progress >= 0.1 && progress < 0.6) {
                    glowText.classList.add('show-content');
                    glowText.classList.remove('hide-content');
                    // simple fade in calculation
                    let fadeInOpacity = (progress - 0.1) * 4;
                    glowText.style.opacity = Math.min(fadeInOpacity, 1);
                } else if (progress >= 0.6) {
                    // fade out
                    let fadeOutOpacity = 1 - (progress - 0.6) * 3;
                    glowText.style.opacity = Math.max(fadeOutOpacity, 0);
                }
            });
        }

        // 4. Product Showcase Logic
        function initProductShowcase() {
            const categoryContainer = document.getElementById('category-filters');
            const thumbnailsContainer = document.getElementById('product-thumbnails-grid');

            // Main Product Elements
            const mainImg = document.getElementById('main-product-image');
            const mainName = document.getElementById('main-product-name');
            const mainDesc = document.getElementById('main-product-description');
            const mainFeatures = document.getElementById('main-product-features');
            const mainEshopBtn = document.getElementById('main-product-eshop-btn');
            const mainDetailBtn = document.getElementById('main-product-detail-btn');

            if (!productData || productData.length === 0) return;

            // Get Unique Categories
            const categories = ["All", ...new Set(productData.map(p => p.category))];
            let currentCategory = "All";
            let currentProduct = productData[0];

            // Render Categories
            categories.forEach((cat, index) => {
                const btn = document.createElement('button');
                btn.className = `category-filter-btn ${index === 0 ? 'active' : ''}`;
                btn.textContent = cat;
                btn.addEventListener('click', () => {
                    // Update Active State
                    document.querySelectorAll('.category-filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    currentCategory = cat;
                    renderThumbnails();
                });
                categoryContainer.appendChild(btn);
            });

            // Render Thumbnails
            function renderThumbnails() {
                thumbnailsContainer.innerHTML = ''; // Clear existing

                const filteredProducts = currentCategory === "All"
                    ? productData
                    : productData.filter(p => p.category === currentCategory);

                filteredProducts.forEach(product => {
                    const thumbBtn = document.createElement('button');
                    thumbBtn.className = `product-thumb-btn ${product.id === currentProduct.id ? 'active' : ''}`;

                    thumbBtn.innerHTML = `
                        <div class="product-thumb-image-wrapper">
                            <img src="${product.imageUrl}" alt="${product.name}" class="product-thumb-image">
                        </div>
                        <p class="product-thumb-name">${product.name}</p>
                    `;

                    thumbBtn.addEventListener('click', () => {
                        // Update Active State
                        document.querySelectorAll('.product-thumb-btn').forEach(b => b.classList.remove('active'));
                        thumbBtn.classList.add('active');

                        // Update Main Display
                        updateMainProduct(product);
                    });

                    thumbnailsContainer.appendChild(thumbBtn);
                });
            }

            // Update Main Product Display
            function updateMainProduct(product) {
                currentProduct = product; // Update state

                // Animate Out (Simple opacity toggle)
                const displayContainer = document.querySelector('.main-product-display');
                displayContainer.style.opacity = 0.5;

                setTimeout(() => {
                    mainImg.src = product.imageUrl;
                    mainName.textContent = product.name;
                    mainDesc.textContent = product.description;
                    mainEshopBtn.href = product.eShopUrl;
                    mainDetailBtn.href = product.url;

                    // Update Features (Icons + Text List)
                    mainFeatures.innerHTML = '';

                    // Render Icons
                    if (product.icons) {
                        product.icons.forEach(icon => {
                            const div = document.createElement('div');
                            div.className = `feature-item ${icon.class}`;
                            // Using a generic SVG for demo, in real project use specific SVGs
                            div.innerHTML = `
                                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" fill="currentColor"/></svg>
                                <span>${icon.name}</span>
                            `;
                            mainFeatures.appendChild(div);
                        });
                    }

                    // Render Text Features (Optional, appended or separate)
                    // You could create another container for text lists if design requires

                    displayContainer.style.opacity = 1;
                }, 200);
            }

            // Initialize
            renderThumbnails();
            updateMainProduct(productData[0]);
        }
    </script>

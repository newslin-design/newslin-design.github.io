<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D White Gallery - Flexible Media</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            font-family: "Inter", sans-serif;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
            z-index: 10;
            transition: opacity 0.5s;
        }

        #overlay h1 {
            font-weight: 300;
            letter-spacing: 5px;
            margin-bottom: 10px;
        }

        #overlay p {
            color: #666;
            font-size: 0.9rem;
            border: 1px solid #ddd;
            padding: 10px 20px;
            border-radius: 50px;
        }

        #loading-status {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #999;
            letter-spacing: 2px;
        }

        #progress-bar-wrap {
            width: 200px;
            height: 2px;
            background: #ddd;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: #333;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        #media-container {
            display: none;
        }

        #media-container video,
        #media-container img {
            display: none;
        }
    </style>
</head>

<body>

    <div id="overlay">
        <h1>WHITE GALLERY</h1>
        <p id="overlay-btn">載入中，請稍候… / LOADING…</p>
        <div id="loading-status">0 / 0</div>
        <div id="progress-bar-wrap">
            <div id="progress-bar"></div>
        </div>
    </div>

    <!-- 媒體容器 - 在這裡自由放置圖片或影片 -->
    <div id="media-container">

        <!-- 前牆 -->
        <div data-wall="front">
            <video loop crossOrigin="anonymous" playsinline muted>
                <source src="001_home.mp4" type="video/mp4">
            </video>
        </div>

        <!-- 左牆 -->
        <div data-wall="left">
            <video loop crossOrigin="anonymous" playsinline muted>
                <source src="002.mp4" type="video/mp4">
            </video>
        </div>

        <!-- 後牆 -->
        <div data-wall="back">
            <video loop crossOrigin="anonymous" playsinline muted>
                <source src="003.mp4" type="video/mp4">
            </video>
        </div>

        <!-- 右牆 -->
        <div data-wall="right">
            <video loop crossOrigin="anonymous" playsinline muted>
                <source src="004.mp4" type="video/mp4">
            </video>
        </div>

    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. 場景初始化
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        // 2. 攝影機
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // 3. 建立白色房間
        const roomWidth = 10;
        const roomHeight = 8;
        const roomDepth = 18;

        const roomGeo = new THREE.BoxGeometry(roomWidth, roomHeight, roomDepth);
        const roomMat = new THREE.MeshStandardMaterial({
            color: 0xfafafa,
            side: THREE.BackSide,
            roughness: 0.4,
            metalness: 0.1
        });
        const room = new THREE.Mesh(roomGeo, roomMat);
        scene.add(room);

        // 4. 燈光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const topLight = new THREE.PointLight(0xffffff, 0.5);
        topLight.position.set(0, 3.8, 0);
        scene.add(topLight);

        // 5. 從容器讀取媒體配置
        const mediaContainer = document.getElementById('media-container');
        const walls = mediaContainer.querySelectorAll('[data-wall]');

        // 牆面位置配置（螢幕放大）
        const wallConfig = {
            front: {
                position: new THREE.Vector3(0, 1.8, -(roomDepth / 2) + 0.05),
                rotation: 0,
                width: 9       // 前牆：從 6 → 9（幾乎填滿整面牆）
            },
            back: {
                position: new THREE.Vector3(0, 1.8, (roomDepth / 2) - 0.05),
                rotation: Math.PI,
                width: 7       // 後牆：從 4 → 7
            },
            left: {
                position: new THREE.Vector3(-(roomWidth / 2) + 0.05, 1.8, 1),
                rotation: Math.PI / 2,
                width: 5.5     // 左牆：從 3 → 5.5
            },
            right: {
                position: new THREE.Vector3((roomWidth / 2) - 0.05, 1.8, 3),
                rotation: -Math.PI / 2,
                width: 6.5     // 右牆：從 4 → 6.5
            }
        };

        // 6. 建立螢幕的函數
        function createScreen(mediaElement, width, position, rotationY) {
            const ratio = 16 / 9;
            const height = width / ratio;

            let texture;

            if (mediaElement.tagName === 'VIDEO') {
                texture = new THREE.VideoTexture(mediaElement);
            } else if (mediaElement.tagName === 'IMG') {
                texture = new THREE.Texture(mediaElement);
                texture.needsUpdate = true;
                if (!mediaElement.complete) {
                    mediaElement.onload = () => { texture.needsUpdate = true; };
                }
            }

            texture.colorSpace = THREE.SRGBColorSpace;

            const geometry = new THREE.PlaneGeometry(width, height);
            const material = new THREE.MeshBasicMaterial({ map: texture });
            const screen = new THREE.Mesh(geometry, material);

            const frameGeo = new THREE.PlaneGeometry(width + 0.05, height + 0.05);
            const frameMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.position.z = -0.005;
            screen.add(frame);

            screen.position.copy(position);
            screen.rotation.y = rotationY;

            scene.add(screen);
            return mediaElement;
        }

        // 7. 自動生成所有牆面的螢幕
        const allMediaElements = [];

        walls.forEach(wall => {
            const wallName = wall.getAttribute('data-wall');
            const mediaElement = wall.querySelector('video, img');
            if (mediaElement && wallConfig[wallName]) {
                const config = wallConfig[wallName];
                const element = createScreen(mediaElement, config.width, config.position, config.rotation);
                allMediaElements.push(element);
            }
        });

        // 8. 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.rotateSpeed = -0.4;
        controls.target.set(0, 1.1, -1);
        controls.update();

        // 9. 等所有影片載入後才允許進入，並同步播放
        const overlay = document.getElementById('overlay');
        const overlayBtn = document.getElementById('overlay-btn');
        const loadingStatus = document.getElementById('loading-status');
        const progressBar = document.getElementById('progress-bar');

        const videoElements = allMediaElements.filter(el => el.tagName === 'VIDEO');
        const total = videoElements.length;
        let readyCount = 0;
        let allReady = false;

        function updateProgress() {
            readyCount++;
            loadingStatus.textContent = `${readyCount} / ${total}`;
            progressBar.style.width = `${(readyCount / total) * 100}%`;

            if (readyCount >= total) {
                allReady = true;
                overlayBtn.textContent = '點擊進入場景 / CLICK TO START';
                overlay.style.cursor = 'pointer';
            }
        }

        if (total === 0) {
            // 沒有影片，直接開放進入
            allReady = true;
            overlayBtn.textContent = '點擊進入場景 / CLICK TO START';
        } else {
            loadingStatus.textContent = `0 / ${total}`;
            // 預先 load 影片（靜音影片在大多數瀏覽器允許自動載入）
            videoElements.forEach(video => {
                video.load();
                if (video.readyState >= 3) {
                    // 已經夠 ready
                    updateProgress();
                } else {
                    video.addEventListener('canplaythrough', updateProgress, { once: true });
                }
            });
        }

        overlay.addEventListener('click', () => {
            if (!allReady) return; // 尚未全部就緒，點擊無效

            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);

            // 所有影片同步播放
            videoElements.forEach(video => video.play());
        });

        // 10. 渲染迴圈
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
